name: Guardiao explicit Metro adapter M141
on:
  push:
    branches:
      - lab/p01-guardiao-portable-metro-m141-v1
permissions:
  contents: read
jobs:
  portable-adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Prepare exact reviewed mobile candidate
        shell: bash
        run: |
          set -euo pipefail
          git apply --check tooling/android/fixtures/guardiao-safe-insets-keyboard-candidate-m117.patch
          git apply tooling/android/fixtures/guardiao-safe-insets-keyboard-candidate-m117.patch
          cp tooling/android/fixtures/guardiao-mobile-m135-package-lock.json apps/mobile/package-lock.json
          cd apps/mobile
          node --input-type=module - <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {overrides} from '../../tooling/android/guardiao_moderate_overrides_m134.mjs';
          const p=JSON.parse(readFileSync('package.json','utf8'));
          if(Object.hasOwn(p,'overrides'))throw Error('unexpected overrides');
          p.overrides=overrides;
          writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          JS
          printf '%s  %s\n' '61bf3916e30b74d248040f236fcb1e9a36e484aadb2331a461509c206849becd' package.json 'f66d6fd261dea4c82332bf0499058a039774da9dcaa77a6e3c30934e702a7c28' package-lock.json | sha256sum -c -
          node ../../tooling/android/verify_guardiao_lock_m119.mjs package.json package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Verify explicit adapter, idempotence and actual Metro assets
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=../../tooling/android/guardiao_portable_metro_m141.mjs
          if node "$SCRIPT" verify; then echo 'BLOCK: unpatched Metro unexpectedly passed'; exit 1; fi
          node "$SCRIPT" apply > first.json
          node "$SCRIPT" apply > second.json
          node "$SCRIPT" verify > verified.json
          node -e 'const a=require("./first.json"),b=require("./second.json"),c=require("./verified.json");if(!a.changed||b.changed||c.changed||a.sha256!==b.sha256||b.sha256!==c.sha256)process.exit(1);console.log("PASS: explicit application and idempotence")'
          rm first.json second.json verified.json
          node ../../tooling/android/guardiao_targeted_overrides_smoke_m126.mjs
          node ../../tooling/android/guardiao_metro_compat_smoke_m127.mjs
          node ../../tooling/android/guardiao_moderate_smoke_m134.mjs
          node ./node_modules/typescript/bin/tsc --noEmit
          node "$SCRIPT" verify
          printf '%s  %s\n' '61bf3916e30b74d248040f236fcb1e9a36e484aadb2331a461509c206849becd' package.json 'f66d6fd261dea4c82332bf0499058a039774da9dcaa77a6e3c30934e702a7c28' package-lock.json | sha256sum -c -
