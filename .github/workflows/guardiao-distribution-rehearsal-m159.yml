name: Guardiao distribution dependency route rehearsal M159 (no distribution)
on:
  push:
    branches:
      - lab/p01-guardiao-distribution-rehearsal-m159-v1
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Generate inert workflow candidate and verify all existing contracts
        run: |
          set -euo pipefail
          node tooling/android/guardiao_distribution_route_m159.mjs tooling/android/fixtures/guardiao-distribution-baseline-m161.yml.txt "$RUNNER_TEMP/m159-candidate-workflow.txt"
          cmp .github/workflows/android-apk.yml "$RUNNER_TEMP/m159-candidate-workflow.txt"
          cp .github/workflows/android-apk.yml "$RUNNER_TEMP/m161-active-workflow"
          trap 'cp "$RUNNER_TEMP/m161-active-workflow" .github/workflows/android-apk.yml' EXIT
          cp tooling/android/fixtures/guardiao-distribution-baseline-m161.yml.txt .github/workflows/android-apk.yml
          npm test > "$RUNNER_TEMP/m159-original.tap" 2>&1 || { grep -E '^(not ok |# (tests|pass|fail) )' "$RUNNER_TEMP/m159-original.tap"; exit 1; }
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/m159-original.tap"
      - name: Rehearse exact reviewed install and prebuild from proposed route
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          node ../../tooling/android/verify_stable_npm_lock.cjs package.json package-lock.json
          npm audit --json --package-lock-only --include=dev --include=optional --include=peer --registry=https://registry.npmjs.org/ > "$RUNNER_TEMP/m159-audit.json"
          node ../../tooling/android/verify_stable_npm_audit.cjs "$RUNNER_TEMP/m159-audit.json"
          grep -Fx '        run: node ../../tooling/android/guardiao_ci_locked_install_m148.mjs install' "$RUNNER_TEMP/m159-candidate-workflow.txt"
          grep -Fx '        run: node ../../tooling/android/guardiao_ci_locked_install_m148.mjs prebuild' "$RUNNER_TEMP/m159-candidate-workflow.txt"
          node ../../tooling/android/guardiao_ci_locked_install_m148.mjs install
          node ./node_modules/typescript/bin/tsc --noEmit
          node ../../tooling/android/verify_no_ota_runtime_override.cjs .
          node ../../tooling/android/guardiao_ci_locked_install_m148.mjs prebuild
          node ../../tooling/android/guardiao_ci_locked_install_m148.mjs verify
          git diff --exit-code -- App.tsx package.json package-lock.json app.json
      - name: Differential contracts against proposed workflow in disposable checkout only
        run: |
          set -euo pipefail
          cp .github/workflows/android-apk.yml "$RUNNER_TEMP/m159-original-workflow"
          trap 'cp "$RUNNER_TEMP/m159-original-workflow" .github/workflows/android-apk.yml' EXIT
          cp "$RUNNER_TEMP/m159-candidate-workflow.txt" .github/workflows/android-apk.yml
          status=0
          npm test > "$RUNNER_TEMP/m159-proposed.tap" 2>&1 || status=$?
          grep -E '^(not ok |# (tests|pass|fail|skipped|cancelled) )' "$RUNNER_TEMP/m159-proposed.tap"
          node tooling/android/guardiao_contract_evidence_m142.mjs "$RUNNER_TEMP/m159-original.tap" 0 "$RUNNER_TEMP/m159-proposed.tap" "$status"
          test "$status" = 0
