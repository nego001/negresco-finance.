name: Guardiao targeted advisory analysis M125
on:
  push:
    branches:
      - lab/p01-guardiao-targeted-advisory-m125-v1
permissions:
  contents: read
concurrency:
  group: guardiao-targeted-advisory-m125-${{ github.ref }}
  cancel-in-progress: true
jobs:
  advisories:
    name: M125 exact high severity advisory and compatible version evidence (NO APK)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Restore unchanged M119 candidate
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/lab/p01-guardiao-targeted-advisory-m125-v1
          test ! -e apps/mobile/package-lock.json
          git apply --check tooling/android/fixtures/guardiao-safe-insets-keyboard-candidate-m117.patch
          git apply tooling/android/fixtures/guardiao-safe-insets-keyboard-candidate-m117.patch
          cp tooling/android/fixtures/guardiao-mobile-m119-package-lock.json apps/mobile/package-lock.json
          printf '%s  %s\n' 'a31326388567fffdfccbe8ec08326fe089356a55f9058c5b669c70a28e579f27' apps/mobile/package-lock.json | sha256sum -c -
          node tooling/android/verify_guardiao_lock_m119.mjs apps/mobile/package.json apps/mobile/package-lock.json
      - name: Query public registry metadata and classify version constraints
        working-directory: apps/mobile
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: |
          set -euo pipefail
          status=0
          npm audit --json --package-lock-only --include=dev --include=optional --include=peer --audit-level=info > "$RUNNER_TEMP/m125-audit.json" 2>"$RUNNER_TEMP/m125-audit.err" || status=$?
          node ../../tooling/android/guardiao_locked_audit_m123.mjs "$RUNNER_TEMP/m125-audit.json" "$status" package-lock.json
          npm view image-size versions --json > "$RUNNER_TEMP/m125-image.json"
          npm view postcss versions --json > "$RUNNER_TEMP/m125-postcss.json"
          NPM_PACKAGE="$(npm root -g)/npm/package.json"
          test -f "$NPM_PACKAGE"
          node ../../tooling/android/guardiao_targeted_advisory_m125.mjs package-lock.json "$RUNNER_TEMP/m125-audit.json" "$RUNNER_TEMP/m125-image.json" "$RUNNER_TEMP/m125-postcss.json" "$NPM_PACKAGE"
          cmp package-lock.json ../../tooling/android/fixtures/guardiao-mobile-m119-package-lock.json
      # No install, override, forced update, APK or production change.
