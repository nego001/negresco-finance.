name: Validate Windows Android Read-only Tools
on:
  push:
    paths:
      - 'tooling/windows/**'
      - '.github/workflows/windows-readonly-tools-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      # Windows runners cannot reliably create checkout workspace directories when
      # the GitHub repository name ends with a dot ("negresco-finance.").
      # Fetch two pinned files by commit SHA, parse them in RUNNER_TEMP instead.
      - name: Parse original scripts in Windows PowerShell 5.1 by immutable Git SHA
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'User-Agent' = 'Negresco-Android-ReadOnly-Parser'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $files = @(
            'tooling/windows/android-v31-readonly-preflight.ps1',
            'tooling/windows/compare-installed-apk.ps1'
          )
          foreach ($repositoryPath in $files) {
            $api = "https://api.github.com/repos/nego001/negresco-finance./contents/$repositoryPath" + "?ref=$env:GITHUB_SHA"
            $response = Invoke-RestMethod -Method Get -Uri $api -Headers $headers
            if ($response.sha -notmatch '^[0-9a-f]{40}$' -or $response.encoding -ne 'base64') {
              throw "Unexpected GitHub content response for $repositoryPath"
            }
            $bytes = [Convert]::FromBase64String(($response.content -replace '\s',''))
            $localPath = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName($repositoryPath))
            [IO.File]::WriteAllBytes($localPath,$bytes)
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $localPath, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_ -ForegroundColor Red }
              throw "PowerShell 5.1 syntax failed: $repositoryPath"
            }
            Write-Host "[OK] Windows PowerShell syntax: $repositoryPath"
          }
