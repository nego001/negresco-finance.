name: Guardiao Android Debug Metro phase diagnostic (synthetic lab only)
on:
  push:
    branches:
      - lab/p01-guardiao-debug-metro-phase-v1
permissions:
  contents: read
concurrency:
  group: guardiao-debug-metro-phase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-debug-pdf:
    name: Synthetic Debug APK and real PDF on Android API 28
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node 22, Java 17 and Android SDK
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Install isolated mobile dependencies and prebuild a new Android test project
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx expo prebuild --platform android --non-interactive --no-install
      - name: Remove denied permissions from disposable Debug manifest overlay
        run: |
          set -euo pipefail
          python3 tooling/android/sanitize_guardiao_debug_manifest.py apps/mobile/android/app/src/debug/AndroidManifest.xml
      - name: Bound Gradle resources and assemble Android Debug, not Release
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          sed -i '/^org.gradle.jvmargs=/d; /^org.gradle.parallel=/d; /^org.gradle.workers.max=/d; /^kotlin.compiler.execution.strategy=/d' android/gradle.properties
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          EOF
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon
      - name: Validate unsigned-for-production debug APK, pin its SHA locally
        run: |
          set -euo pipefail
          APK=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test ! -L "$APK"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq 'application-debuggable'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > /tmp/negresco-lab-debug-permissions
          for denied in android.permission.SYSTEM_ALERT_WINDOW android.permission.WRITE_EXTERNAL_STORAGE android.permission.READ_EXTERNAL_STORAGE android.permission.READ_MEDIA_IMAGES; do
            if grep -Fq "$denied" /tmp/negresco-lab-debug-permissions; then
              printf 'BLOCK (LAB): forbidden Android permission present: %s\n' "$denied"
              exit 1
            fi
          done
          sha256sum "$APK" > /tmp/negresco-debug-test-apk.sha256
          echo 'PASS (LAB): disposable debuggable APK validated, SHA stored inside ephemeral runner'
      - name: Build independent permissionless PDF receiver, no Maven or Gradle
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
          bash tooling/android/pdf-receiver-lab/build_receiving_apk.sh
      - name: Install offline PDF semantic tools without logging extracted text
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
      - name: Enable test emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-negresco-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual Debug-only phase markers, real chooser and synthetic PDF
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tooling/android/guardiao_pdf_debug_metro_lab.py
      # Evidence stays on the ephemeral runner; nothing is uploaded or published.
