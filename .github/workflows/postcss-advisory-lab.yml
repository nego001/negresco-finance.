name: PostCSS advisory patch feasibility (lab only)
on:
  push:
    branches:
      - lab/p01-postcss-patch-feasibility-v1
      - lab/p01-postcss-patched-apk-v1
permissions:
  contents: read
concurrency:
  group: postcss-advisory-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare-review-only:
    name: Evaluate isolated PostCSS override, never promote
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout disposable security laboratory
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use fixed Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          registry-url: https://registry.npmjs.org
      - name: Generate unmodified baseline lock and advisories
        run: |
          set -euo pipefail
          test ! -e package-lock.json
          mkdir -p advisory-lab
          cp package.json advisory-lab/baseline-package.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund \
            --lockfile-version=3 --registry=https://registry.npmjs.org/
          cp package-lock.json advisory-lab/baseline-lock.json
          npm audit --json --package-lock-only \
            --registry=https://registry.npmjs.org/ > advisory-lab/baseline-audit.json || true
      - name: Build patched PostCSS candidate without installing code
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(p.overrides!==undefined||p.dependencies?.postcss||p.devDependencies?.postcss)
            throw new Error('BLOCK: cannot experiment over existing PostCSS constraints');
          p.overrides={postcss:'8.5.23'};
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund \
            --lockfile-version=3 --registry=https://registry.npmjs.org/
          cp package-lock.json advisory-lab/postcss-candidate-lock.json
          npm audit --json --package-lock-only \
            --registry=https://registry.npmjs.org/ > advisory-lab/postcss-candidate-audit.json || true
      - name: Compare both dependency graphs and security advisories
        run: |
          set -euo pipefail
          node ../../tooling/android/assess_postcss_patch_candidate.cjs \
            advisory-lab/baseline-lock.json advisory-lab/postcss-candidate-lock.json \
            advisory-lab/baseline-audit.json advisory-lab/postcss-candidate-audit.json \
            advisory-lab/POSTCSS_PATCH_FEASIBILITY.json
      - name: Upload unreviewed research, not an installable release
        uses: actions/upload-artifact@v4
        with:
          name: postcss-lab-unreviewed-comparison
          path: |
            apps/mobile/advisory-lab/baseline-package.json
            apps/mobile/advisory-lab/baseline-lock.json
            apps/mobile/advisory-lab/postcss-candidate-lock.json
            apps/mobile/advisory-lab/baseline-audit.json
            apps/mobile/advisory-lab/postcss-candidate-audit.json
            apps/mobile/advisory-lab/POSTCSS_PATCH_FEASIBILITY.json
          if-no-files-found: error
          retention-days: 7
  smoke-patched-expo:
    name: Smoke and assemble debug-signed test APK (no release)
    needs: compare-review-only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout disposable source without push privileges
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set pinned Node for isolated smoke test
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          registry-url: https://registry.npmjs.org
      - name: Install pinned Android Java toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download unreviewed comparison from the same workflow run
        uses: actions/download-artifact@v4
        with:
          name: postcss-lab-unreviewed-comparison
          path: apps/mobile/advisory-review
      - name: Verify comparison identity and stage transient manifest
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const root='advisory-review/';
          const report=JSON.parse(fs.readFileSync(root+'POSTCSS_PATCH_FEASIBILITY.json','utf8'));
          if(report.label!=='UNREVIEWED EXPERIMENT - NEVER PUBLISH'||
             report.reviewed!==false||report.expoUnchanged!==true||
             report.afterPostcss.some(x=>x.version!=='8.5.23'))
            throw new Error('BLOCK: unreviewed candidate policy mismatch');
          const lockBytes=fs.readFileSync(root+'postcss-candidate-lock.json');
          const hash=crypto.createHash('sha256').update(lockBytes).digest('hex');
          if(hash!==report.sourceDigests.candidateLockSha256)
            throw new Error('BLOCK: downloaded lock bytes differ from comparison');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(pkg.overrides!==undefined||pkg.dependencies?.postcss)
            throw new Error('BLOCK: candidate may not replace source overrides');
          pkg.overrides={postcss:'8.5.23'};
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          fs.writeFileSync('package-lock.json',lockBytes,{flag:'wx'});
          NODE
      - name: Run locked npm install in disposable runner
        run: npm ci --no-audit --no-fund
      - name: Typecheck React Native code against candidate
        run: npx tsc --noEmit
      - name: Generate Expo SDK 54 Android native project with candidate
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --non-interactive --no-install
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/values/strings.xml
      - name: Verify laboratory preview config after prebuild
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const app=JSON.parse(fs.readFileSync('app.json','utf8')).expo;
          if(pkg.overrides?.postcss!=='8.5.23'||app.version!=='3.1.3'||
             app.runtimeVersion?.policy!=='appVersion'||
             app.updates?.requestHeaders?.['expo-channel-name']!=='preview'||
             app.updates?.codeSigningCertificate!==undefined)
            throw new Error('BLOCK: candidate changed preview OTA policy');
          console.log('PASS (LAB ONLY): TS + Expo prebuild with isolated PostCSS patch');
          NODE

      - name: Set Gradle memory for Expo SDK 54 test APK
        run: |
          set -euo pipefail
          PROPS=android/gradle.properties
          test -f "$PROPS"
          sed -i '/^org.gradle.jvmargs=/d; /^org.gradle.parallel=/d; /^org.gradle.workers.max=/d; /^kotlin.compiler.execution.strategy=/d' "$PROPS"
          cat >> "$PROPS" <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          EOF
          python3 ../../tooling/android/verify_generated_ota_runtime.py app.json android/app/src/main/AndroidManifest.xml android/app/src/main/res/values/strings.xml android/app/src/main/res
      - name: Build release variant under Android Debug certificate only
        run: |
          set -euo pipefail
          test ! -e android/app/negresco-ci-release.jks
          test -d "$ANDROID_HOME"
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease --no-daemon)
      - name: Validate APK and pin its SHA-256
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$TOOLS/apksigner"
          test -x "$TOOLS/aapt2"
          "$TOOLS/apksigner" verify --verbose "$APK"
          python3 ../../tooling/android/verify_release_apk_surface.py "$APK"
          python3 ../../tooling/android/verify_compiled_ota_manifest.py --parse-only "$APK"
          python3 ../../tooling/android/verify_compiled_ota_runtime.py "$APK" "$TOOLS/aapt2" 3.1.3
          python3 ../../tooling/android/verify_compiled_preview_ota.py "$APK"
          python3 ../../tooling/android/verify_packaged_expo_config.py "$APK"
          sha256sum "$APK" > postcss-patched-apk.sha256
          echo "PASS (LAB ONLY): Debug-signed APK verified, NEVER production OTA"
      - name: Upload APK as short-lived unreviewed laboratory evidence
        uses: actions/upload-artifact@v4
        with:
          name: postcss-lab-debug-signed-apk-unreviewed
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/postcss-patched-apk.sha256
            apps/mobile/advisory-review/POSTCSS_PATCH_FEASIBILITY.json
          if-no-files-found: error
          retention-days: 3

  verify-downloaded-patched-apk:
    name: Reverify downloaded PostCSS APK without publication
    needs: smoke-patched-expo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted verifier code without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download APK from same execution
        uses: actions/download-artifact@v4
        with:
          name: postcss-lab-debug-signed-apk-unreviewed
          path: candidate-apk
      - name: Verify hardcoded APK location and original checksum
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import re
          from pathlib import Path
          root=Path('candidate-apk')
          apk=root/'android/app/build/outputs/apk/release/app-release.apk'
          manifest=root/'postcss-patched-apk.sha256'
          for path in (apk,manifest):
              if path.is_symlink() or not path.is_file() or not 0<path.stat().st_size<1024*1024*1024:
                  raise SystemExit('BLOCK: missing, linked or oversized downloaded APK/manifest')
          expected=re.fullmatch(rb'([0-9a-f]{64})  android/app/build/outputs/apk/release/app-release\.apk\n',manifest.read_bytes())
          if expected is None:
              raise SystemExit('BLOCK: noncanonical SHA-256 filename or format')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest().encode()
          if digest!=expected.group(1):
              raise SystemExit('BLOCK: actual APK bytes differ from signed-out producer checksum')
          print('PASS (LAB ONLY): downloaded candidate SHA-256 reverified')
          PY
      - name: Inspect downloaded APK signature and both OTA configurations
        run: |
          set -euo pipefail
          APK=candidate-apk/android/app/build/outputs/apk/release/app-release.apk
          test -d "$ANDROID_HOME"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$TOOLS/apksigner"
          test -x "$TOOLS/aapt2"
          "$TOOLS/apksigner" verify --verbose "$APK"
          python3 tooling/android/verify_release_apk_surface.py "$APK"
          python3 tooling/android/verify_compiled_ota_manifest.py --parse-only "$APK"
          python3 tooling/android/verify_compiled_ota_runtime.py "$APK" "$TOOLS/aapt2" 3.1.3
          python3 tooling/android/verify_compiled_preview_ota.py "$APK"
          python3 tooling/android/verify_packaged_expo_config.py "$APK"
          echo "PASS (LAB ONLY): downloaded compiled APK OTA policy reverified"
