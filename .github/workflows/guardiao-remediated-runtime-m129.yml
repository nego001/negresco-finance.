name: Guardiao remediated Android 9 runtime M129
on:
  push:
    branches:
      - lab/p01-guardiao-remediated-runtime-m129-v1
permissions:
  contents: read
  actions: read
concurrency:
  group: guardiao-locked-runtime-m129-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-debug-pdf:
    name: M129 locked dependencies and two PDFs API28
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node 22, Java 17 and Android SDK
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Apply exact M117 patch and guarded final screen recovery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          ref = "refs/heads/lab/p01-guardiao-remediated-runtime-m129-v1"
          if os.environ.get("GITHUB_ACTIONS") != "true" or os.environ.get("GITHUB_REF") != ref:
              raise SystemExit("M129 scope unconfirmed")
          p = Path("tooling/android/guardiao_post_receipt_focus_m118.py")
          if not p.is_file() or p.is_symlink():
              raise SystemExit("M129 source unconfirmed")
          source = p.read_text(encoding="utf-8")
          before = 'LAB_REF = "refs/heads/lab/p01-guardiao-post-receipt-focus-m118-v1"'
          if source.count(before) != 1:
              raise SystemExit("M129 scope anchor unconfirmed")
          p.write_text(source.replace(before, 'LAB_REF = "' + ref + '"', 1), encoding="utf-8")
          PY
          python3 tooling/android/guardiao_post_receipt_focus_m118.py apply
      - name: Retrieve exact approved M128 candidate metadata
        uses: actions/download-artifact@v4
        with:
          name: m128-eligible-targeted-candidate
          path: ${{ runner.temp }}/m129-candidate
          run-id: 45733924181
          repository: nego001/negresco-finance.
          github-token: ${{ github.token }}
      - name: Verify exact approved lock and manifest before installation
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          test ! -e package-lock.json
          test ! -e node_modules
          CAND="$RUNNER_TEMP/m129-candidate"
          for name in package.json package-lock.json summary.json metro-assets.sha256; do
            test -f "$CAND/$name"
            test ! -L "$CAND/$name"
          done
          printf '%s  %s\n' 'cbb8bec52cb7d62a9959cd92bb195c943ade634794b0f634e3c1af2f182c78b3' "$CAND/package-lock.json" | sha256sum -c -
          node --input-type=module - <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          import {overrides} from '../../tooling/android/guardiao_targeted_overrides_m126.mjs';
          const dir=process.env.RUNNER_TEMP+'/m129-candidate/';
          const p=JSON.parse(readFileSync('package.json','utf8'));
          assert.ok(!Object.hasOwn(p,'overrides'));
          p.overrides=overrides;
          const expected=JSON.stringify(p,null,2)+'\n';
          assert.equal(readFileSync(dir+'package.json','utf8'),expected);
          const s=JSON.parse(readFileSync(dir+'summary.json','utf8'));
          assert.equal(s.candidateEligible,true);assert.equal(s.approvedForProduction,false);
          assert.equal(s.after.high,0);assert.equal(s.after.critical,0);assert.equal(s.candidatePackages,747);
          assert.equal(readFileSync(dir+'metro-assets.sha256','utf8').trim().split(/\s+/)[0],'3ea2b5f6792077da751938c13dbec55440c88b1fac9dde679df56f6e1683e7c0');
          writeFileSync('package.json',expected);
          JS
          cp "$CAND/package-lock.json" package-lock.json
          node ../../tooling/android/verify_guardiao_lock_m119.mjs package.json package-lock.json
          sha256sum package-lock.json > "$RUNNER_TEMP/m129-lock.sha256"
      - name: Install isolated mobile dependencies and prebuild a new Android test project
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          sha256sum -c "$RUNNER_TEMP/m129-lock.sha256"
          node -e 'const b=require("expo/bundledNativeModules.json"); const p=require("react-native-safe-area-context/package.json"); if(b["react-native-safe-area-context"]!=="~5.6.0" || p.version!=="5.6.0") process.exit(1); console.log("PASS (LAB): Expo SDK safe area dependency version attested")'
          ./node_modules/.bin/tsc --noEmit
          # SDK 54 links prebuilt Expo AARs by default. Only in this disposable
          # Debug workspace, compile expo-print's instrumented Kotlin from source.
          node ../../tooling/android/guardiao_metro_runtime_adapter_m129.mjs apply
          node ../../tooling/android/guardiao_targeted_overrides_smoke_m126.mjs
          node ../../tooling/android/guardiao_metro_compat_smoke_m127.mjs
          python3 ../../tooling/android/guardiao_pdf_native_phase_lab.py source-build
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const p=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/m129-candidate/package.json','utf8'));
          assert.ok(!Object.hasOwn(p,'expo'));
          p.expo={autolinking:{android:{buildFromSource:['expo-print']}}};
          assert.deepEqual(JSON.parse(readFileSync('package.json','utf8')),p);
          JS
          cp package.json "$RUNNER_TEMP/m129-before-prebuild.json"
          CI=1 ./node_modules/.bin/expo prebuild --platform android --no-install
          node ../../tooling/android/guardiao_runtime_prebuild_integrity_m129.mjs "$RUNNER_TEMP/m129-before-prebuild.json" package.json
          cp "$RUNNER_TEMP/m129-before-prebuild.json" package.json
          python3 ../../tooling/android/guardiao_pdf_native_phase_lab.py install
          node ../../tooling/android/guardiao_metro_runtime_adapter_m129.mjs verify
          node ../../tooling/android/verify_guardiao_lock_m119.mjs package.json package-lock.json
          sha256sum -c "$RUNNER_TEMP/m129-lock.sha256"
      - name: Remove denied permissions from disposable Debug manifest overlay
        run: |
          set -euo pipefail
          python3 tooling/android/sanitize_guardiao_debug_manifest.py apps/mobile/android/app/src/debug/AndroidManifest.xml
      - name: Scope Metro HTTP exception to disposable Debug loopback resources
        run: |
          set -euo pipefail
          python3 tooling/android/guardiao_debug_loopback_policy.py install
      - name: Bound Gradle resources and assemble Android Debug, not Release
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          sed -i '/^org.gradle.jvmargs=/d; /^org.gradle.parallel=/d; /^org.gradle.workers.max=/d; /^kotlin.compiler.execution.strategy=/d' android/gradle.properties
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          EOF
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon
      - name: Validate unsigned-for-production debug APK, pin its SHA locally
        run: |
          set -euo pipefail
          APK=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test ! -L "$APK"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq 'application-debuggable'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > /tmp/negresco-lab-debug-permissions
          for denied in android.permission.SYSTEM_ALERT_WINDOW android.permission.WRITE_EXTERNAL_STORAGE android.permission.READ_EXTERNAL_STORAGE android.permission.READ_MEDIA_IMAGES; do
            if grep -Fq "$denied" /tmp/negresco-lab-debug-permissions; then
              printf 'BLOCK (LAB): forbidden Android permission present: %s\n' "$denied"
              exit 1
            fi
          done
          python3 tooling/android/guardiao_debug_loopback_policy.py verify-apk "$APK" "$ANDROID_HOME/build-tools/35.0.0/aapt"
          sha256sum "$APK" > /tmp/negresco-debug-test-apk.sha256
          echo 'PASS (LAB): disposable debuggable APK validated, SHA stored inside ephemeral runner'
      - name: Verify compiled disposable Debug APK includes the native print hooks
        run: |
          set -euo pipefail
          python3 tooling/android/guardiao_pdf_native_phase_lab.py verify-debug-apk
      - name: Build independent permissionless PDF receiver, no Maven or Gradle
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
          bash tooling/android/pdf-receiver-lab/build_receiving_apk.sh
      - name: Install offline PDF semantic tools without logging extracted text
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
      - name: Enable test emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-negresco-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prove two synthetic PDFs with guarded Home navigation and unchanged PID
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tooling/android/guardiao_debug_pdf_two_same_pid_lab.py
      - name: Confirm original lockfile unchanged after runtime
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/m129-lock.sha256"
          cmp package-lock.json "$RUNNER_TEMP/m129-candidate/package-lock.json"
          cmp package.json "$RUNNER_TEMP/m129-before-prebuild.json"
          node ../../tooling/android/guardiao_metro_runtime_adapter_m129.mjs verify
          git diff --exit-code -- ../../tooling/android/fixtures/guardiao-mobile-m119-package-lock.json
      # Evidence stays on the ephemeral runner; nothing is uploaded or published.
