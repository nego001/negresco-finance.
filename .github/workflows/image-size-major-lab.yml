name: image-size 2.0.3 upgrade feasibility (lab only)
on:
  push:
    branches:
      - lab/p01-image-size-major-feasibility-v1
permissions:
  contents: read
concurrency:
  group: image-size-major-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    name: Evaluate security and graph diff without installation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout isolated source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin Node.js 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          registry-url: https://registry.npmjs.org
      - name: Generate PostCSS-fixed reference lock without scripts
        run: |
          set -euo pipefail
          test ! -e package-lock.json
          mkdir -p image-size-lab
          cp package.json image-size-lab/source-package.json
          node <<'NODE'
          const fs=require('node:fs'),p=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(p.overrides!==undefined||p.dependencies?.['image-size'])
            throw Error('BLOCK: experiment requires unchanged production manifest');
          p.overrides={postcss:'8.5.23'};
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --lockfile-version=3 --registry=https://registry.npmjs.org/
          cp package-lock.json image-size-lab/postcss-reference-lock.json
          npm audit --json --package-lock-only --registry=https://registry.npmjs.org/ > image-size-lab/postcss-reference-audit.json || true
      - name: Generate isolated image-size 2.0.3 candidate
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),p=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(JSON.stringify(p.overrides)!=='{"postcss":"8.5.23"}')throw Error('BLOCK: unexpected reference override');
          p.overrides['image-size']='2.0.3';
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --lockfile-version=3 --registry=https://registry.npmjs.org/
          cp package-lock.json image-size-lab/image-size-candidate-lock.json
          npm audit --json --package-lock-only --registry=https://registry.npmjs.org/ > image-size-lab/image-size-candidate-audit.json || true
      - name: Compare locked resolutions and known vulnerabilities
        run: |
          set -euo pipefail
          node ../../tooling/android/compare_image_size_major.cjs \
            image-size-lab/postcss-reference-lock.json image-size-lab/image-size-candidate-lock.json \
            image-size-lab/postcss-reference-audit.json image-size-lab/image-size-candidate-audit.json \
            image-size-lab/IMAGE_SIZE_MAJOR_FEASIBILITY.json
      - name: Upload only unreviewed research evidence
        uses: actions/upload-artifact@v4
        with:
          name: image-size-major-unreviewed-comparison
          path: |
            apps/mobile/image-size-lab/source-package.json
            apps/mobile/image-size-lab/postcss-reference-lock.json
            apps/mobile/image-size-lab/image-size-candidate-lock.json
            apps/mobile/image-size-lab/postcss-reference-audit.json
            apps/mobile/image-size-lab/image-size-candidate-audit.json
            apps/mobile/image-size-lab/IMAGE_SIZE_MAJOR_FEASIBILITY.json
          retention-days: 7
          if-no-files-found: error

  smoke:
    name: Check npm ci, TypeScript and Expo native generation only
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin Node.js 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          registry-url: https://registry.npmjs.org
      - name: Download evidence generated by the same workflow
        uses: actions/download-artifact@v4
        with:
          name: image-size-major-unreviewed-comparison
          path: apps/mobile/image-size-review
      - name: Verify SHA-256 of experimental lock before installation
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const dir='image-size-review/';
          const report=JSON.parse(fs.readFileSync(dir+'IMAGE_SIZE_MAJOR_FEASIBILITY.json','utf8'));
          const source=fs.readFileSync('package.json');
          const expected=fs.readFileSync(dir+'source-package.json');
          const lock=fs.readFileSync(dir+'image-size-candidate-lock.json');
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          if(!source.equals(expected)||report.label!=='UNREVIEWED IMAGE-SIZE MAJOR EXPERIMENT - DO NOT PUBLISH'||
             report.reviewed!==false||report.expoUnchanged!==true||report.patchedImageSize!=='2.0.3'||
             report.sourceDigests.candidateLock!==sha(lock))
            throw Error('BLOCK: artifact identity mismatch or unreviewed candidate misrepresented');
          const p=JSON.parse(source);
          if(p.overrides!==undefined||p.dependencies?.['image-size'])throw Error('BLOCK: source already modified');
          p.overrides={postcss:'8.5.23','image-size':'2.0.3'};
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          fs.writeFileSync('package-lock.json',lock,{flag:'wx'});
          NODE
      - name: Install candidate packages from immutable npm lock
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript against image-size v2 candidate
        run: npx tsc --noEmit
      - name: Generate native Android sources without compilation
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --non-interactive --no-install
          test -s android/app/src/main/AndroidManifest.xml
          python3 ../../tooling/android/verify_generated_ota_runtime.py app.json android/app/src/main/AndroidManifest.xml android/app/src/main/res/values/strings.xml android/app/src/main/res
          echo "PASS (LAB ONLY): image-size 2.0.3 npm ci + TS + Expo prebuild"
