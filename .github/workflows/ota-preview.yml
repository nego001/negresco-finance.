name: OTA Preview (P0 security hold - publishing disabled)
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Review-only reason; does not publish an OTA update"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ota-preview-blocked-${{ github.ref }}
  cancel-in-progress: false
jobs:
  block-unreviewed-ota:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block preview OTA until security approval
        run: |
          echo "::error::P0 security hold: Expo OTA publishing is disabled pending reviewed dependency audit, signing policy, release provenance and human approval."
          exit 1
