name: Guardiao current candidate Release-mode API28 PDF replay (synthetic only)
on:
  push:
    branches:
      - lab/p01-guardiao-candidate-release-api28-pdf-replay-v1
permissions:
  contents: read
  actions: read
concurrency:
  group: guardiao-candidate-release-api28-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api28-current-candidate:
    name: Pinned DEBUG-SIGNED Release-mode candidate API28 independent sample ${{ matrix.sample }}
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        sample: [a, b, c]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download known current test-only candidate, never original Release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: negresco-finance-v313-security-preview
          run-id: 43741679134
          repository: nego001/negresco-finance.
          github-token: ${{ github.token }}
          path: test-apk
      - name: Verify candidate artifact hash and place in isolated preexisting runner path
        run: |
          set -euo pipefail
          APK=test-apk/Negresco-Finance-V3.1.3-preview.apk
          test -f "$APK"
          test ! -L "$APK"
          echo '544bd201327606711a573bf99729894ee44338fc6e14e5d872c67a4662bbdc59  test-apk/Negresco-Finance-V3.1.3-preview.apk' | sha256sum --check --strict
          install -D -m 0600 "$APK" test-apk/android/app/build/outputs/apk/release/app-release.apk
          echo '544bd201327606711a573bf99729894ee44338fc6e14e5d872c67a4662bbdc59  test-apk/android/app/build/outputs/apk/release/app-release.apk' | sha256sum --check --strict
          echo 'PASS (LAB): exact candidate SHA verified, original Release not substituted'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Build independent permissionless PDF receiving app
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
          bash tooling/android/pdf-receiver-lab/build_receiving_apk.sh
      - name: Confirm Poppler for offline synthetic PDF text verification
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
      - name: Enable GitHub Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-negresco-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify one real PDF per independent sample of the pinned test-only candidate
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tooling/android/guardiao_candidate_release_api28_pdf_lab.py
      # No APK build, signing, publication, OTA, artifact upload, or PDF export.
