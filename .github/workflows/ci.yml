name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  native-lock-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Kotlin policy and run isolated scenarios
        run: gradle -p tooling/native-lock-spike policyCheck --no-daemon
  native-lock-android-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android SDK
        run: test -d "${ANDROID_HOME:?Android SDK unavailable}" && test -d "$ANDROID_HOME/platforms/android-35"
      - name: Compile isolated native Android adapters (not an APK)
        run: gradle -p tooling/native-lock-android-lab compileDebugKotlin --no-daemon
  sqlcipher-android-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android SDK
        run: test -d "${ANDROID_HOME:?Android SDK unavailable}" && test -d "$ANDROID_HOME/platforms/android-35"
      - name: Compile pinned SQLCipher Android library (no APK, no emulator)
        run: gradle -p tooling/sqlcipher-android-lab compileDebugKotlin compileDebugAndroidTestKotlin --no-daemon
