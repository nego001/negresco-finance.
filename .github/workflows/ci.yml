name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
# Only the newest revision of the same branch/PR should consume emulator minutes.
concurrency:
  group: negresco-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  expo-native-diagnostic-compile:
    # Compile the actual Expo-local Kotlin module without assembling/publishing
    # an APK or injecting any bank data, credentials or Keystore operations.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check ephemeral Android SDK
        run: |
          test -d "${ANDROID_HOME:?Android SDK unavailable}"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || test -d "$ANDROID_HOME/platforms/android-36"
          fi
      - name: Install Expo SDK 54 dependencies without executing Android app
        run: npm install --no-audit --no-fund
      - name: Generate disposable Expo Android Gradle project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Compile local diagnostic Kotlin module (NO APK)
        run: |
          set -euo pipefail
          test -f modules/negresco-finance-security/expo-module.config.json
          chmod +x android/gradlew
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          EOF
          cd android
          ./gradlew :negresco-finance-security:compileDebugKotlin :negresco-finance-security:compileDebugAndroidTestKotlin --no-daemon --stacktrace

  expo-native-diagnostic-emulator:
    # Test-only AndroidKeyStore scenario in an isolated CI emulator.
    # Builds only an instrumentation APK, never the app release APK.
    if: github.event_name == 'pull_request'
    needs: expo-native-diagnostic-compile
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install disposable Expo dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund
      - name: Generate Android test Gradle project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Set bounded Gradle resources
        working-directory: apps/mobile
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          EOF
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-negresco-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute AndroidKeyStore synthetic module instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            cd apps/mobile/android
            chmod +x gradlew
            ./gradlew :negresco-finance-security:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload synthetic module instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: expo-native-synthetic-test-reports
          path: apps/mobile/modules/negresco-finance-security/android/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 3

  native-lock-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Kotlin policy and run isolated scenarios
        run: gradle -p tooling/native-lock-spike policyCheck --no-daemon
  native-lock-android-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android SDK
        run: test -d "${ANDROID_HOME:?Android SDK unavailable}" && test -d "$ANDROID_HOME/platforms/android-35"
      - name: Compile isolated native Android adapters (not an APK)
        run: gradle -p tooling/native-lock-android-lab compileDebugKotlin compileDebugAndroidTestKotlin --no-daemon
  native-lock-android-emulator:
    # Real Android DataStore tests in an isolated throwaway emulator, PR only.
    # Unlike the SQLCipher emulator job this never prompts for fingerprints.
    if: github.event_name == 'pull_request'
    needs: native-lock-android-lab
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable hardware accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-negresco-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated native DataStore recovery and revocation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: gradle -p tooling/native-lock-android-lab connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload synthetic native-lock test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-lock-emulator-test-reports
          path: tooling/native-lock-android-lab/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 3

  sqlcipher-android-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Ensure Android SDK API 36 (ephemeral GitHub runner only)
        run: |
          test -d "${ANDROID_HOME:?Android SDK unavailable}"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || test -d "$ANDROID_HOME/platforms/android-36"
          fi
          test -d "$ANDROID_HOME/platforms/android-36"
      - name: Compile pinned SQLCipher Android library (no APK, no emulator)
        run: gradle -p tooling/sqlcipher-android-lab compileDebugKotlin compileDebugAndroidTestKotlin --no-daemon

  sqlcipher-android-emulator:
    # Execute JNI tests only once per PR; push events still compile the lab.
    if: github.event_name == 'pull_request'
    needs: sqlcipher-android-lab
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable hardware accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-negresco-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install compile SDK 36 (temporary runner)
        run: |
          test -d "${ANDROID_HOME:?Android SDK unavailable}"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || test -d "$ANDROID_HOME/platforms/android-36"
          fi
          test -d "$ANDROID_HOME/platforms/android-36"
      - name: Run disposable SQLCipher JNI tests in an isolated Android emulator
        # Pinned commit behind upstream v2 tag. No user device or production data.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: gradle -p tooling/sqlcipher-android-lab connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload synthetic instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-emulator-test-reports
          path: tooling/sqlcipher-android-lab/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 3

  authority-postgres-lab:
    # Schema smoke in a throwaway CI database. NOT a deployed enrollment server.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: negresco_sec05c_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify isolated PostgreSQL schema and uniqueness invariants
        env:
          PGPASSWORD: disposable_ci_only
        run: |
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
          psql -h localhost -U postgres -d negresco_sec05c_lab -v ON_ERROR_STOP=1 \
            -f tooling/security-authority-protocol-lab/postgres/001_sec05c_schema.sql
          psql -h localhost -U postgres -d negresco_sec05c_lab -v ON_ERROR_STOP=1 \
            -f tooling/security-authority-protocol-lab/postgres/002_sec05c_schema_smoke.sql
          # CI-only SQL function is not part of the proposed deployed schema.
          psql -h localhost -U postgres -d negresco_sec05c_lab -v ON_ERROR_STOP=1 \
            -f tooling/security-authority-protocol-lab/postgres/003_sec05d_ci_receipt_rehearsal.sql
          PGHOST=localhost PGUSER=postgres PGDATABASE=negresco_sec05c_lab \
            python3 tooling/security-authority-protocol-lab/tests/sec05d_multi_connection_smoke.py
          psql -h localhost -U postgres -d negresco_sec05c_lab -v ON_ERROR_STOP=1 \
            -f tooling/security-authority-protocol-lab/postgres/004_sec05k_cas_persistence_lab.sql
          NEGRESCO_LAB_PG_URL=jdbc:postgresql://localhost:5432/negresco_sec05c_lab \
            PGUSER=postgres gradle -p tooling/native-lock-spike pgBoundProofCheck pgRekeyCasCheck --no-daemon
