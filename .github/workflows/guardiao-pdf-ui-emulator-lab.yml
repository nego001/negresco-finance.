name: Guardiao PDF real receiver and page render Android 8-9 (lab only)
on:
  push:
    branches:
      - lab/p01-guardiao-pdf-receiver-integrity-26-28-v1
permissions:
  contents: read
  actions: read
concurrency:
  group: guardiao-pdf-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pdf-ui:
    name: Receive and render real synthetic PDF on Android API ${{ matrix.api }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 28]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download independently audited minimal-PDF probe APK from PR 106 (read-only)
        uses: actions/download-artifact@v4
        with:
          name: negresco-finance-v313-test-apk
          run-id: 40617164086
          repository: nego001/negresco-finance.
          github-token: ${{ github.token }}
          path: test-apk
      - name: Independently lock exact source APK SHA and package
        run: |
          set -euo pipefail
          echo '29e248742e365c4dd7a8c668a23153d43a89b8be02828620bbc5851775986b4a  test-apk/android/app/build/outputs/apk/release/app-release.apk' | sha256sum --check --strict
          test -s test-apk/android/app/build/outputs/apk/release/app-release.apk
      - name: Setup Java 17 for isolated Android receiver
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Setup pinned Gradle for independent PDF receiver
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Compile isolated receiver APK (never built into Negresco)
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
          gradle --project-dir tooling/android/pdf-receiver-lab :app:assembleDebug --no-daemon --console=plain
          RECEIVER="tooling/android/pdf-receiver-lab/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$RECEIVER"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RECEIVER" | grep -F "package: name='com.negresco.pdfreceiver.lab'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$RECEIVER" | grep -Fq "uses-permission:"; then
            echo "::error::Receiver lab APK must declare no permissions"
            exit 1
          fi
      - name: Enable Android hardware emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-negresco-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real app embedded PDF UI smoke on old Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tooling/android/guardiao_pdf_ui_emulator_smoke.py
      - name: Upload tiny synthetic outcome, no UI dumps, screenshots or PDFs
        uses: actions/upload-artifact@v4
        with:
          name: guardiao-pdf-received-api-${{ matrix.api }}-unreviewed
          path: pdf-ui-emulator-report.json
          if-no-files-found: error
          retention-days: 2
