name: Guardiao PDF error phase real UI API 26/28 (lab only)
on:
  push:
    branches:
      - lab/p01-guardiao-pdf-phase-ui-android-26-28-v1
permissions:
  contents: read
  actions: read
concurrency:
  group: guardiao-pdf-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pdf-ui:
    name: Exercise synthetic PDF system chooser on Android API ${{ matrix.api }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 28]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download independently audited phase-diagnostic APK from PR 104 (read-only)
        uses: actions/download-artifact@v4
        with:
          name: negresco-finance-v313-test-apk
          run-id: 40592242061
          repository: nego001/negresco-finance.
          github-token: ${{ github.token }}
          path: test-apk
      - name: Independently lock exact source APK SHA and package
        run: |
          set -euo pipefail
          echo '642707ba661fa2b5bc547225b49587827b47de6412634211164338aa63388f19  test-apk/android/app/build/outputs/apk/release/app-release.apk' | sha256sum --check --strict
          test -s test-apk/android/app/build/outputs/apk/release/app-release.apk
      - name: Enable Android hardware emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-negresco-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real app embedded PDF UI smoke on old Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tooling/android/guardiao_pdf_ui_emulator_smoke.py
      - name: Upload tiny synthetic outcome, no UI dumps, screenshots or PDFs
        uses: actions/upload-artifact@v4
        with:
          name: guardiao-pdf-phase-api-${{ matrix.api }}-unreviewed
          path: pdf-ui-emulator-report.json
          if-no-files-found: error
          retention-days: 2
