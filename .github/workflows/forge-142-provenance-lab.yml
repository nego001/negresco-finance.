name: node-forge 1.4.2 official package provenance (lab only)
on:
  push:
    branches:
      - lab/p01-forge-142-provenance-v1
permissions:
  contents: read
jobs:
  produce:
    name: Verify npm package against immutable official Git tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          registry-url: https://registry.npmjs.org
      - name: Stage isolated npm lock without changing source manifest
        run: |
          set -euo pipefail
          test ! -e package-lock.json
          mkdir forge142-proof
          cp package.json forge142-proof/source-package.json
          node -e "const f=require('fs'),p=require('./package.json');if(p.overrides||p.dependencies?.['node-forge']||p.name!=='@negresco/mobile'||p.version!=='3.1.3')throw Error('BLOCK: source manifest');p.overrides={postcss:'8.5.23','image-size':'2.0.3'};f.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --lockfile-version=3
          cp package-lock.json forge142-proof/candidate-lock.json
      - name: Inspect unsuppressed npm advisories
        run: npm audit --json --package-lock-only > forge142-proof/audit.json
      - name: Install exact candidate without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify harmless Buffer PEM parsing compatibility
        run: |
          set -euo pipefail
          node <<'NODE'
          const forge=require('node-forge');
          const buffer=Buffer.from('-----BEGIN A-----\nQUJD\n-----END A-----\n');
          const m=forge.pem.decode(buffer);
          if(!Array.isArray(m)||m.length!==1||m[0].type!=='A'||m[0].body!=='ABC')
            throw Error('BLOCK: node-forge 1.4.2 Buffer PEM regression');
          console.log('PASS (LAB): synthetic Buffer PEM decode returned ABC');
          NODE
      - name: Download npm tarball and source from immutable official tag commit
        run: |
          set -euo pipefail
          npm pack node-forge@1.4.2 --ignore-scripts --silent --pack-destination forge142-proof
          curl --fail --silent --show-error --location --retry 2 https://raw.githubusercontent.com/digitalbazaar/forge/7928054627d93ab8c0216b756246e8ca8d62a93e/lib/rsa.js -o forge142-proof/upstream-rsa.js
          curl --fail --silent --show-error --location --retry 2 https://raw.githubusercontent.com/digitalbazaar/forge/7928054627d93ab8c0216b756246e8ca8d62a93e/lib/pem.js -o forge142-proof/upstream-pem.js
      - name: Check registry integrity, source equality and advisory snapshot
        run: |
          node ../../tooling/android/forge_142_registry_provenance.cjs capture forge142-proof/candidate-lock.json forge142-proof/node-forge-1.4.2.tgz node_modules/node-forge/lib/rsa.js forge142-proof/upstream-rsa.js node_modules/node-forge/lib/pem.js forge142-proof/upstream-pem.js node_modules/node-forge/package.json forge142-proof/audit.json "$GITHUB_SHA" forge142-proof/FORGE_142_PROVENANCE.json
      - name: Upload metadata only, never npm source or APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-142-registry-unreviewed
          path: |
            apps/mobile/forge142-proof/source-package.json
            apps/mobile/forge142-proof/candidate-lock.json
            apps/mobile/forge142-proof/audit.json
            apps/mobile/forge142-proof/FORGE_142_PROVENANCE.json
          if-no-files-found: error
          retention-days: 3

  independent:
    name: Independently reproduce registry-to-upstream source proof
    needs: produce
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: forge-142-registry-unreviewed
          path: apps/mobile/forge142-proof
      - name: Verify source manifest and reuse exact downloaded candidate lock
        run: |
          set -euo pipefail
          test ! -e package-lock.json
          node -e "const f=require('fs'),b=f.readFileSync('package.json');if(!b.equals(f.readFileSync('forge142-proof/source-package.json')))throw Error('BLOCK: manifest mismatch');const p=JSON.parse(b);if(p.overrides||p.dependencies?.['node-forge'])throw Error('BLOCK: source changed');p.overrides={postcss:'8.5.23','image-size':'2.0.3'};f.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');f.copyFileSync('forge142-proof/candidate-lock.json','package-lock.json',f.constants.COPYFILE_EXCL)"
      - name: Reinstall exact lock without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Independently inspect current advisories
        run: npm audit --json --package-lock-only > forge142-proof/fresh-audit.json
      - name: Verify harmless Buffer PEM parsing compatibility
        run: |
          set -euo pipefail
          node <<'NODE'
          const forge=require('node-forge');
          const buffer=Buffer.from('-----BEGIN A-----\nQUJD\n-----END A-----\n');
          const m=forge.pem.decode(buffer);
          if(!Array.isArray(m)||m.length!==1||m[0].type!=='A'||m[0].body!=='ABC')
            throw Error('BLOCK: node-forge 1.4.2 Buffer PEM regression');
          console.log('PASS (LAB): synthetic Buffer PEM decode returned ABC');
          NODE
      - name: Independently download npm tarball and immutable Git code
        run: |
          set -euo pipefail
          npm pack node-forge@1.4.2 --ignore-scripts --silent --pack-destination forge142-proof
          curl --fail --silent --show-error --location --retry 2 https://raw.githubusercontent.com/digitalbazaar/forge/7928054627d93ab8c0216b756246e8ca8d62a93e/lib/rsa.js -o forge142-proof/upstream-rsa.js
          curl --fail --silent --show-error --location --retry 2 https://raw.githubusercontent.com/digitalbazaar/forge/7928054627d93ab8c0216b756246e8ca8d62a93e/lib/pem.js -o forge142-proof/upstream-pem.js
      - name: Independent compare report byte-for-byte
        run: |
          node ../../tooling/android/forge_142_registry_provenance.cjs verify forge142-proof/candidate-lock.json forge142-proof/node-forge-1.4.2.tgz node_modules/node-forge/lib/rsa.js forge142-proof/upstream-rsa.js node_modules/node-forge/lib/pem.js forge142-proof/upstream-pem.js node_modules/node-forge/package.json forge142-proof/fresh-audit.json "$GITHUB_SHA" forge142-proof/FORGE_142_PROVENANCE.json
