name: Guardiao conservative dependency remediation M124
on:
  push:
    branches:
      - lab/p01-guardiao-audit-remediation-m124-v1
permissions:
  contents: read
concurrency:
  group: guardiao-audit-remediation-m124-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    name: M124 bounded dependency fix candidate (NO APK)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Restore exact lab candidate
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/lab/p01-guardiao-audit-remediation-m124-v1
          test ! -e apps/mobile/package-lock.json
          git apply --check tooling/android/fixtures/guardiao-safe-insets-keyboard-candidate-m117.patch
          git apply tooling/android/fixtures/guardiao-safe-insets-keyboard-candidate-m117.patch
          cp tooling/android/fixtures/guardiao-mobile-m119-package-lock.json apps/mobile/package-lock.json
          printf '%s  %s\n' 'a31326388567fffdfccbe8ec08326fe089356a55f9058c5b669c70a28e579f27' apps/mobile/package-lock.json | sha256sum -c -
          node tooling/android/verify_guardiao_lock_m119.mjs apps/mobile/package.json apps/mobile/package-lock.json
      - name: Compare before and after non-forced lock-only fix
        working-directory: apps/mobile
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
          NPM_CONFIG_FORCE: 'false'
        run: |
          set -euo pipefail
          cp package.json "$RUNNER_TEMP/m124-manifest.json"
          cp package-lock.json "$RUNNER_TEMP/m124-original.json"
          audit() {
            local status=0
            npm audit --json --package-lock-only --include=dev --include=optional --include=peer --audit-level=info > "$RUNNER_TEMP/m124-$1-raw.json" 2>"$RUNNER_TEMP/m124-$1.err" || status=$?
            node ../../tooling/android/guardiao_locked_audit_m123.mjs "$RUNNER_TEMP/m124-$1-raw.json" "$status" package-lock.json > "$RUNNER_TEMP/m124-$1.json"
          }
          audit before
          cmp package-lock.json "$RUNNER_TEMP/m124-original.json"
          status=0
          npm audit fix --package-lock-only --ignore-scripts --no-force --json --include=dev --include=optional --include=peer > "$RUNNER_TEMP/m124-fix.json" 2>"$RUNNER_TEMP/m124-fix.err" || status=$?
          test "$status" = 0 || test "$status" = 1
          node -e 'const r=require(process.argv[1]);if(r.error||!r.audit)process.exit(1)' "$RUNNER_TEMP/m124-fix.json"
          cmp package.json "$RUNNER_TEMP/m124-manifest.json"
          node ../../tooling/android/verify_guardiao_lock_m119.mjs package.json package-lock.json
          audit after
          node ../../tooling/android/guardiao_audit_remediation_m124.mjs package.json "$RUNNER_TEMP/m124-original.json" package-lock.json "$RUNNER_TEMP/m124-before.json" "$RUNNER_TEMP/m124-after.json" > "$RUNNER_TEMP/m124-summary.json"
          cat "$RUNNER_TEMP/m124-summary.json"
          sha256sum package-lock.json
          cmp "$RUNNER_TEMP/m124-original.json" ../../tooling/android/fixtures/guardiao-mobile-m119-package-lock.json
      - name: Retain candidate only if high and critical findings are eliminated
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          if node -e 'process.exit(require(process.argv[1]).candidateEligible?0:1)' "$RUNNER_TEMP/m124-summary.json"; then
            sha256sum package-lock.json > "$RUNNER_TEMP/m124-candidate.sha256"
            npm ci --ignore-scripts --no-audit --no-fund
            ./node_modules/.bin/tsc --noEmit
            sha256sum -c "$RUNNER_TEMP/m124-candidate.sha256"
            mkdir "$RUNNER_TEMP/m124-eligible"
            cp package-lock.json "$RUNNER_TEMP/m124-eligible/package-lock.json"
            cp "$RUNNER_TEMP/m124-summary.json" "$RUNNER_TEMP/m124-eligible/summary.json"
          else
            echo "BLOCK (LAB): candidate not eligible for subsequent runtime testing"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: m124-eligible-lock-candidate
          path: ${{ runner.temp }}/m124-eligible/
          if-no-files-found: ignore
          retention-days: 7
