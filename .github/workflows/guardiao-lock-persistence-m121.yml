name: Guardiao lock persistence M121
on:
  push:
    branches:
      - lab/p01-guardiao-lock-persistence-m121-v1
permissions:
  contents: read
  actions: read
concurrency:
  group: guardiao-lock-persistence-m121-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lock-export:
    name: M121 exact public dependency lock transfer (NO APK)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Retrieve immutable M119 lock artifact
        uses: actions/download-artifact@v4
        with:
          name: m119-mobile-dependency-lock-candidate
          path: ${{ runner.temp }}/m121-lock
          run-id: 45688506254
          repository: nego001/negresco-finance.
          github-token: ${{ github.token }}
      - name: Verify exact candidate in disposable checkout
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/lab/p01-guardiao-lock-persistence-m121-v1
          test ! -e apps/mobile/package-lock.json
          test ! -e apps/mobile/node_modules
          git apply --check tooling/android/fixtures/guardiao-safe-insets-keyboard-candidate-m117.patch
          git apply tooling/android/fixtures/guardiao-safe-insets-keyboard-candidate-m117.patch
          lock="$RUNNER_TEMP/m121-lock/package-lock.json"
          test -f "$lock"
          test ! -L "$lock"
          printf '%s  %s\n' 'a31326388567fffdfccbe8ec08326fe089356a55f9058c5b669c70a28e579f27' "$lock" | sha256sum -c -
          cp "$lock" apps/mobile/package-lock.json
          node tooling/android/verify_guardiao_lock_m119.mjs apps/mobile/package.json apps/mobile/package-lock.json
      - name: Recheck clean install without lifecycle scripts
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          ./node_modules/.bin/tsc --noEmit
          printf '%s  %s\n' 'a31326388567fffdfccbe8ec08326fe089356a55f9058c5b669c70a28e579f27' package-lock.json | sha256sum -c -
      - name: Transfer only immutable public registry metadata for external Git commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          raw = pathlib.Path("apps/mobile/package-lock.json").read_bytes()
          digest = "a31326388567fffdfccbe8ec08326fe089356a55f9058c5b669c70a28e579f27"
          if len(raw) != 353587 or hashlib.sha256(raw).hexdigest() != digest:
              raise SystemExit("lock bytes mismatch")
          if len(json.loads(raw)["packages"]) != 749 or not raw.endswith(b"\n"):
              raise SystemExit("lock graph mismatch")
          # Public registry lock only, never app data or environment variables.
          for i, line in enumerate(raw.decode("utf-8").split("\n")[:-1]):
              print(f"M121_LOCK:{i:06d}:{line}")
          print(f"M121_LOCK_END:{i+1}:{digest}")
          PY
      # No token write permission, APK, production change or publication.
