name: Mobile static check
on:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-check.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
