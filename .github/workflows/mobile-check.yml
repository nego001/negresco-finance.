name: Mobile static check
on:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-check.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect tracked mobile lock before installation
        id: mobile_lock
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'tracked=true' >> "$GITHUB_OUTPUT"
          else
            echo 'tracked=false' >> "$GITHUB_OUTPUT"
          fi
      - run: npm install --no-audit --no-fund
        if: steps.mobile_lock.outputs.tracked == 'false'
      - run: node ../../tooling/android/guardiao_ci_locked_install_m148.mjs install
        if: steps.mobile_lock.outputs.tracked == 'true'
      - run: node ./node_modules/typescript/bin/tsc --noEmit
      - run: node ../../tooling/android/guardiao_ci_locked_install_m148.mjs verify
        if: steps.mobile_lock.outputs.tracked == 'true'
