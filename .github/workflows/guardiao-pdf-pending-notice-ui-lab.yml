name: Guardiao Android 9 Debug pending PDF warning (synthetic-only)
on:
  push:
    branches:
      - lab/p01-guardiao-pdf-pending-ui-e2e-v1
permissions:
  contents: read
concurrency:
  group: negresco-pending-notice-api28-lab
  cancel-in-progress: true
jobs:
  android9-pending-warning:
    name: Synthetic unresolved print; observable UI warning, stable PID and no PDF
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Install synthetic unresolved print in disposable CI copy only
        env:
          NEGRESCO_PENDING_NOTICE_LAB: '1'
        run: |
          set -euo pipefail
          python3 tooling/android/guardiao_pdf_pending_notice_ui_lab.py install
      - name: Install mobile and prebuild disposable Android Debug
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx expo prebuild --platform android --non-interactive --no-install
      - name: Drop denied Android Debug permissions
        run: |
          set -euo pipefail
          python3 tooling/android/sanitize_guardiao_debug_manifest.py apps/mobile/android/app/src/debug/AndroidManifest.xml
      - name: Scope loopback policy to disposable Debug
        run: |
          set -euo pipefail
          python3 tooling/android/guardiao_debug_loopback_policy.py install
      - name: Assemble Android Debug with bounded Gradle
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          sed -i '/^org.gradle.jvmargs=/d; /^org.gradle.parallel=/d; /^org.gradle.workers.max=/d; /^kotlin.compiler.execution.strategy=/d' android/gradle.properties
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          EOF
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon
      - name: Validate disposable Debug APK, SHA and denied permissions
        run: |
          set -euo pipefail
          APK=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test ! -L "$APK"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq application-debuggable
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" >/tmp/negresco-notice-debug-permissions
          for denied in android.permission.SYSTEM_ALERT_WINDOW android.permission.WRITE_EXTERNAL_STORAGE android.permission.READ_EXTERNAL_STORAGE android.permission.READ_MEDIA_IMAGES; do
            if grep -Fq "$denied" /tmp/negresco-notice-debug-permissions; then
              echo 'BLOCK (LAB): forbidden Android permission'
              exit 1
            fi
          done
          python3 tooling/android/guardiao_debug_loopback_policy.py verify-apk "$APK" "$ANDROID_HOME/build-tools/35.0.0/aapt"
          sha256sum "$APK" >/tmp/negresco-debug-test-apk.sha256
          echo 'PASS (LAB): disposable Debug SHA, signature and permissions verified'
      - name: Compile independent synthetic receiver for negative receipt check
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
          bash tooling/android/pdf-receiver-lab/build_receiving_apk.sh
      - name: Enable emulator KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-negresco-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prove accessible 30-second warning without native print or chooser
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tooling/android/guardiao_pdf_pending_notice_ui_lab.py run
      # No Release, no upload, no credential, no bank data or Android payment.
