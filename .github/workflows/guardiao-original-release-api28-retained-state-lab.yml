name: Guardiao immutable Release Android 9 retained app state replay (synthetic lab only)
on:
  push:
    branches:
      - lab/p01-guardiao-debug-metro-phase-v1
permissions:
  contents: read
  actions: read
concurrency:
  group: guardiao-api28-retained-state-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-api28-retained-state:
    name: Two PDF exports without app data wipe on one Android 9 emulator
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download original immutable financial APK only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: negresco-finance-v313-security-preview
          run-id: 40617164086
          repository: nego001/negresco-finance.
          github-token: ${{ github.token }}
          path: test-apk
      - name: Require exact original SHA twice and never rebuild Release
        run: |
          set -euo pipefail
          test -f test-apk/Negresco-Finance-V3.1.3-preview.apk
          test ! -L test-apk/Negresco-Finance-V3.1.3-preview.apk
          echo '29e248742e365c4dd7a8c668a23153d43a89b8be02828620bbc5851775986b4a  test-apk/Negresco-Finance-V3.1.3-preview.apk' | sha256sum --check --strict
          install -D -m 0600 test-apk/Negresco-Finance-V3.1.3-preview.apk test-apk/android/app/build/outputs/apk/release/app-release.apk
          echo '29e248742e365c4dd7a8c668a23153d43a89b8be02828620bbc5851775986b4a  test-apk/android/app/build/outputs/apk/release/app-release.apk' | sha256sum --check --strict
          test -s test-apk/android/app/build/outputs/apk/release/app-release.apk
      - name: Setup Java 17 and Android SDK for separate test receiver
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK tooling
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Build zero-permission receiver, never production APK
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
          bash tooling/android/pdf-receiver-lab/build_receiving_apk.sh
      - name: Require offline local PDF semantic tools
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-negresco-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run verified exports across app process restart without data wipe
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tooling/android/guardiao_original_release_retained_state_lab.py
      - name: Reject missing, unsafe or unverified local receipt from either cycle
        run: python3 tooling/android/verify_guardiao_api28_two_cycle_receipts.py retained-state-receipts
      - name: Publish metadata only, never PDF, app files, screenshot or logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guardiao-api28-retained-state-metadata-unreviewed
          path: retained-state-receipts/
          if-no-files-found: error
          retention-days: 2
  after-upload:
    name: Reaudit retained-state API28 receipts in a separate job
    needs: android-api28-retained-state
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download only the paired metadata receipts of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: guardiao-api28-retained-state-metadata-unreviewed
          path: retained-state-review
      - name: Fail closed unless both cycle receipts pass independent inspection
        run: python3 tooling/android/verify_guardiao_api28_two_cycle_receipts.py retained-state-review
