name: Android APK (3.1.3 security preview)
on:
  workflow_dispatch:
    inputs:
      stable_signing:
        description: 'Sign with the configured private release keystore (requires secrets and certificate fingerprint)'
        required: true
        default: false
        type: boolean
      publish_release:
        description: 'Publish only a stable-signed, fingerprint-verified prerelease from a manual main dispatch'
        required: true
        default: false
        type: boolean
  push:
    paths:
      - 'apps/mobile/**'
      - 'tests/mobile-baseline.test.mjs'
      - 'tooling/android/verify_release_apk_surface.py'
      - 'tooling/android/verify_release_bundle_consistency.py'
      - 'tests/android-release-apk-debug-surface.test.mjs'
      - 'tests/android-release-bundle-consistency.test.mjs'
      - 'tests/android-apk-ci-permissions.test.mjs'
      - 'tests/android-signing.test.mjs'
      - 'tests/android-publish-artifact-reverification.test.mjs'
      - 'tests/android-draft-release-atomicity.test.mjs'
      - 'tests/android-release-provenance.test.mjs'
      - 'tests/android-explicit-release-tag.test.mjs'
      - 'tests/android-immutable-release-policy.test.mjs'
      - 'tests/android-readonly-release-policy-credential.test.mjs'
      - 'tests/android-release-collision-preflight.test.mjs'
      - 'tests/android-postpublish-immutable-audit.test.mjs'
      - 'tests/android-draft-rest-crosscheck.test.mjs'
      - 'tests/android-rest-authoritative-assets.test.mjs'
      - 'tests/android-strict-sha256-manifest.test.mjs'
      - 'tests/android-publish-apk-identity.test.mjs'
      - 'tests/android-publish-apk-manifest-security.test.mjs'
      - '.github/workflows/android-apk.yml'
# Keep only the newest candidate compiling when multiple source commits arrive.
concurrency:
  group: android-candidate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest runners include Android SDK; avoid setup-android initialization failure.
      - name: Locate Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -d "${ANDROID_HOME:?Android SDK not available on runner}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Validate P0 repository contracts
        working-directory: .
        run: npm test
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      # Expo SDK 54 includes Kotlin/KSP-heavy modules (expo-updates, expo-modules-core).
      # The default 512 MiB Gradle Metaspace caused OutOfMemoryError on hosted runners.
      - name: Configure Gradle memory and Kotlin compilation
        run: |
          set -euo pipefail
          PROPS=android/gradle.properties
          test -f "$PROPS"
          sed -i '/^org.gradle.jvmargs=/d; /^org.gradle.parallel=/d; /^org.gradle.workers.max=/d; /^kotlin.compiler.execution.strategy=/d' "$PROPS"
          cat >> "$PROPS" <<'EOF'
          # CI-only settings, regenerated by Expo prebuild for every build.
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          EOF
          grep -E '^(org.gradle.jvmargs|org.gradle.parallel|org.gradle.workers.max|kotlin.compiler.execution.strategy)=' "$PROPS"
      - name: Inspect native Expo Updates configuration
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "=== Android local backup policy ==="
          if ! grep -Eq 'android:allowBackup="false"' "$MANIFEST"; then
            echo "::error::Android Auto Backup must remain disabled until secure data recovery is designed."
            exit 1
          fi
          echo "=== Expo Updates Android manifest entries ==="
          grep -n -A 4 -B 2 -E 'expo.modules.updates|expo-channel-name|EXPO_UPDATE' "$MANIFEST" || true
          echo "=== OTA references in Android resources ==="
          grep -R -n -E 'u.expo.dev|expo-channel-name|preview|0.2.0' android/app/src/main/res | head -80 || true
          echo "=== Expo resolved configuration ==="
          npx expo config --json | node -e '
            let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{
              const e=JSON.parse(s);
              const u=e.updates||{};
              console.log(JSON.stringify({runtimeVersion:e.runtimeVersion,updates:{enabled:u.enabled,url:u.url,requestHeaders:u.requestHeaders},projectId:e.extra?.eas?.projectId},null,2));
              if(u.url!=="https://u.expo.dev/a506611f-a159-4341-bed7-28dcbd47bf95"||u.requestHeaders?.["expo-channel-name"]!=="preview")process.exit(1);
            });
          '
      - name: Reject release publication with Debug signing or wrong trigger
        if: ${{ inputs.publish_release && (!inputs.stable_signing || github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main') }}
        run: |
          echo "::error::Publishing requires explicitly enabled stable signing and a manual dispatch on main."
          exit 1
      - name: Reject stable signing outside a manually dispatched main build
        if: ${{ inputs.stable_signing && (github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main') }}
        run: |
          echo "::error::Stable signing is allowed only after an explicit manual dispatch on main."
          exit 1
      - name: Build standalone test APK
        env:
          NEGRESCO_USE_STABLE_SIGNING: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.stable_signing && 'true' || 'false' }}
          NEGRESCO_RELEASE_KEYSTORE_B64: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.stable_signing && secrets.NEGRESCO_RELEASE_KEYSTORE_B64 || '' }}
          NEGRESCO_RELEASE_STORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.stable_signing && secrets.NEGRESCO_RELEASE_STORE_PASSWORD || '' }}
          NEGRESCO_RELEASE_KEY_ALIAS: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.stable_signing && secrets.NEGRESCO_RELEASE_KEY_ALIAS || '' }}
          NEGRESCO_RELEASE_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.stable_signing && secrets.NEGRESCO_RELEASE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [[ "$NEGRESCO_USE_STABLE_SIGNING" == "true" ]]; then
            export NEGRESCO_SIGNING_STORE_FILE="$PWD/android/app/negresco-ci-release.jks"
            node ../../tooling/android/configure-release-signing.cjs
            echo "Opt-in signing enabled. The final certificate is verified in the next step."
          else
            echo "::notice::This APK uses the Android Debug certificate. It is a TEST candidate, not a stable release."
          fi
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Delete ephemeral signing material
        if: always()
        run: rm -f android/app/negresco-ci-release.jks
      - name: Verify APK structure and signature
        env:
          NEGRESCO_USE_STABLE_SIGNING: ${{ inputs.stable_signing && 'true' || 'false' }}
          NEGRESCO_EXPECTED_CERT_SHA256: ${{ vars.NEGRESCO_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          # Inspect the exact assembled APK, rejecting missing/duplicate DEX ZIP entries
          # and any known Debug QA class; the Release AAR gate remains separate.
          python3 ../../tooling/android/verify_release_apk_surface.py "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.negresco.finance'"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "versionCode='34' versionName='3.1.3'"
          "$BUILD_TOOLS/aapt" dump permissions "$APK" | grep -F 'android.permission.USE_BIOMETRIC'
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee APK-SIGNATURE.txt
          CERT_HASH="$(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F]{64}).*/\1/p' APK-SIGNATURE.txt | head -n 1 | tr '[:upper:]' '[:lower:]')"
          [[ "$CERT_HASH" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Could not identify APK signing certificate SHA-256."; exit 1; }
          if [[ "$NEGRESCO_USE_STABLE_SIGNING" == "true" ]]; then
            EXPECTED="$(printf '%s' "$NEGRESCO_EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
            [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Configure repository Actions variable NEGRESCO_EXPECTED_CERT_SHA256 first."; exit 1; }
            [[ "$CERT_HASH" == "$EXPECTED" ]] || { echo "::error::Certificate does not match pinned release fingerprint."; exit 1; }
            if grep -q 'CN=Android Debug' APK-SIGNATURE.txt; then
              echo "::error::Debug certificate cannot be used as a stable release identity."
              exit 1
            fi
            echo "Signature identity verified against the pinned release certificate."
          else
            grep -q 'CN=Android Debug' APK-SIGNATURE.txt || { echo "::error::Unexpected test signing identity."; exit 1; }
            echo "::notice::Debug-signed APK, for testing only. Preserve app data before changing signing identities."
          fi
          sha256sum "$APK" | tee android-apk.sha256
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: negresco-finance-v313-test-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android-apk.sha256
            apps/mobile/APK-SIGNATURE.txt
          if-no-files-found: error
          retention-days: 7

      - name: Package downloadable ZIP and release notes
        run: |
          set -euo pipefail
          mkdir -p release-package
          cp android/app/build/outputs/apk/release/app-release.apk release-package/Negresco-Finance-V3.1.3-preview.apk
          cp android-apk.sha256 release-package/SHA256-original-apk.txt
          cp APK-SIGNATURE.txt release-package/APK-SIGNATURE.txt
          cat > release-package/LEIA-ME.txt <<'EOF'
          NEGRESCO FINANCE - V3.1.3 (CANDIDATO DE TESTES, NAO PRODUCAO)
          Android package: com.negresco.finance
          Instalacao: extraia o APK ou baixe o APK separado no GitHub Releases.
          Estado: interface inicial experimental; sem operacoes bancarias reais.
          Integridade: confira o SHA256 publicado nos detalhes da versao.
          Identidade de assinatura: compare APK-SIGNATURE.txt entre versoes.
          Com stable_signing=false, assinatura Android Debug. Teste apenas.
          Este APK nao ativa o SQLCipher, a biometria criptografica nem recuperacao offline de banco.
          Com stable_signing=true, certificado estavel exige credenciais e hash esperados.
          Trocar de certificado pode impedir atualizacao e exigir migracao de dados.
          Atualizacao sobre APK anterior nao e garantida sem compatibilidade de assinatura e versionCode.
          EOF
          cp release-package/Negresco-Finance-V3.1.3-preview.apk Negresco-Finance-V3.1.3-preview.apk
          (cd release-package && zip -q -9 -r ../Negresco-Finance-V3.1.3-preview.zip .)
          sha256sum Negresco-Finance-V3.1.3-preview.apk Negresco-Finance-V3.1.3-preview.zip APK-SIGNATURE.txt > SHA256-release.txt
          cat > RELEASE_NOTES.md <<'EOF'
          ## Negresco Finance V3.1.3 - PREVIA de testes

          APK experimental Android, ainda sem validacao manual em dispositivo.

          ### Arquivos
          - Negresco-Finance-V3.1.3-preview.apk: instalador Android.
          - Negresco-Finance-V3.1.3-preview.zip: pacote com instalador, instrucoes e hash.
          - SHA256-release.txt: verificacao de integridade dos downloads.
          - APK-SIGNATURE.txt: identidade publica do certificado usado para assinar o APK.

          ### Recursos incluidos
          - Interface OLED e preferencias visuais.
          - Bloqueio de interface por biometria forte, opcional nos Ajustes; requer nova instalacao nativa 3.1.1.
          - Diagnostico manual de SecureStore autenticado, com somente marcador ficticio e tentativa de limpeza.
          - Bloqueio Android de capturas de tela no Guardiao e em areas protegidas pelo bloqueio biometrico; exige APK nativo 3.1.2 ou posterior.
          - Guardiao: verificacao matematica de linhas digitaveis, PDF local e historico resumido em armazenamento seguro.
          - Consulta opcional de cadastro CNPJ via BrasilAPI, servico de terceiros.
          - Indicadores transparentes de integracoes indisponiveis.

          ### Limitacoes
          - PREVIA 3.1.3: o APK NAO inclui os laboratorios Kotlin de SQLCipher, CryptoObject ou recuperacao; eles continuam fora do bundle Expo.
          - A assinatura Debug pode ser diferente da assinatura do APK instalado. Nao tentar sobrepor instalacao existente sem verificar certificado e preservar dados locais.
          - A verificacao matematica e o cadastro de empresa nao comprovam legitimidade de boleto.
          - Sem acesso real a bancos, Pix, Reclame Aqui ou monitoramento automatico.
          - Nao usar para operacoes financeiras reais.
          - Bloqueio biometrico e protecao de capturas nao criptografam dados nem impedem fotografia externa da tela.
          - PDFs compartilhados ficam sujeitos as protecoes do aplicativo de destino.
          - A instalacao de uma nova versao nativa e necessaria para novas dependencias.
          - Por padrao, APKs ainda sao assinados com certificado Android Debug. Assinatura permanente e opcional e exige credenciais + fingerprint configurados.
          - Assinatura verificada nao comprova atualizacao possivel sobre qualquer instalacao antiga. Compare certificados e versionCode.
          - Nunca desinstale uma versao existente sem antes decidir como preservar os dados locais.
          EOF
      - name: Verify APK identity across original, standalone and ZIP candidate
        run: |
          set -euo pipefail
          python3 ../../tooling/android/verify_release_bundle_consistency.py .
      # Always upload a complete candidate independently of GitHub Releases write access.
      - name: Preserve full release bundle as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: negresco-finance-v313-security-preview
          path: |
            apps/mobile/Negresco-Finance-V3.1.3-preview.apk
            apps/mobile/Negresco-Finance-V3.1.3-preview.zip
            apps/mobile/SHA256-release.txt
            apps/mobile/APK-SIGNATURE.txt
            apps/mobile/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  # Read-only branch builds may generate disposable APK artifacts, never releases.
  # Only an explicit manual main dispatch can schedule the separate WRITE job.
  publish-test-prerelease:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release && inputs.stable_signing }}
    needs: build-test-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Release candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: negresco-finance-v313-security-preview
          path: release-payload
      - name: Verify downloaded candidate contents before publication
        working-directory: release-payload
        run: |
          set -euo pipefail
          # The checksum file is input from a downloaded build artifact.
          # sha256sum -c accepts arbitrary listed paths, so parse and bound
          # the manifest before it can open any file.
          node <<'NODE'
          const fs = require("node:fs");
          const expectedHashes = [
            "Negresco-Finance-V3.1.3-preview.apk",
            "Negresco-Finance-V3.1.3-preview.zip",
            "APK-SIGNATURE.txt"
          ];
          const expectedFiles = [...expectedHashes, "SHA256-release.txt", "RELEASE_NOTES.md"];
          function block(message) {
            console.error("BLOCK: invalid release payload manifest: " + message);
            process.exit(1);
          }
          const actual = fs.readdirSync(".");
          if (actual.length !== expectedFiles.length ||
              actual.some(name => !expectedFiles.includes(name))) {
            block("unexpected, hidden or missing downloaded files");
          }
          for (const name of expectedFiles) {
            const stat = fs.lstatSync(name);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size === 0)
              block("missing, empty, linked or nonregular artifact: " + name);
          }
          const raw = fs.readFileSync("SHA256-release.txt");
          if (raw.length > 4096 || raw.includes(0) || raw.includes(13))
            block("manifest is too large or contains NUL/CR bytes");
          const lines = raw.toString("utf8").split("\n");
          if (lines.length !== expectedHashes.length + 1 || lines.at(-1) !== "")
            block("manifest must contain exactly three newline-terminated entries");
          for (let i = 0; i < expectedHashes.length; i++) {
            const match = /^([a-f0-9]{64})  (.+)$/.exec(lines[i]);
            if (!match || match[2] !== expectedHashes[i])
              block("unexpected, duplicate or unsafe checksum path");
          }
          console.log("PASS: checksum manifest and payload contain exactly the approved files");
          NODE
          sha256sum --strict --check SHA256-release.txt
      - name: Reverify downloaded release certificate and ZIP identity
        working-directory: release-payload
        env:
          NEGRESCO_EXPECTED_CERT_SHA256: ${{ vars.NEGRESCO_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          EXPECTED="$(printf '%s' "$NEGRESCO_EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Release certificate pin is missing or malformed."; exit 1; }
          test -d "${ANDROID_HOME:?Android SDK unavailable}"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          # Re-parse the downloaded APK, never just the build job's claims.
          # These checks run in the separate privileged publisher without a checkout.
          test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/aapt" dump badging Negresco-Finance-V3.1.3-preview.apk > verified-apk-badging.txt
          "$BUILD_TOOLS/aapt" dump permissions Negresco-Finance-V3.1.3-preview.apk > verified-apk-permissions.txt
          "$BUILD_TOOLS/aapt" dump xmltree Negresco-Finance-V3.1.3-preview.apk AndroidManifest.xml > verified-apk-manifest.txt
          node <<'NODE'
          const fs = require("node:fs");
          function reject(message) {
            console.error("BLOCK: unexpected signed APK identity: " + message);
            process.exit(1);
          }
          const badging = fs.readFileSync("verified-apk-badging.txt", "utf8");
          const packageLines = badging.split(/\r?\n/).filter(line => line.startsWith("package:"));
          if (packageLines.length !== 1) reject("exactly one package declaration is required");
          const match = /^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'(?: .*)?$/.exec(packageLines[0]);
          if (!match || match[1] !== "com.negresco.finance" ||
              match[2] !== "34" || match[3] !== "3.1.3")
            reject("package name, versionCode or versionName differs");
          const permissions = fs.readFileSync("verified-apk-permissions.txt", "utf8");
          const biometric = permissions.split(/\r?\n/)
            .filter(line => /^uses-permission: name='android\.permission\.USE_BIOMETRIC'(?: |$)/.test(line));
          if (biometric.length !== 1) reject("expected single USE_BIOMETRIC permission is absent or duplicated");
          // Android defaults allowBackup to true, so an absent flag is unsafe.
          // Read the compiled APK manifest rather than trusting Expo config.
          const tree = fs.readFileSync("verified-apk-manifest.txt", "utf8").split(/\r?\n/);
          const application = tree.map((line, i) => ({line, i}))
            .filter(item => /^\s*E: application(?:\s|$)/.test(item.line));
          if (application.length !== 1) reject("exactly one compiled application element is required");
          const top = application[0].i;
          const attrs = [];
          for (let i = top + 1; i < tree.length; i++) {
            if (/^\s*E: /.test(tree[i])) break; // do not inspect nested components
            if (/^\s*A: /.test(tree[i])) attrs.push(tree[i]);
          }
          function attribute(name, required) {
            const matches = attrs.filter(line => new RegExp("^\\s*A: android:" + name + "\\(").test(line));
            if (matches.length > 1 || (required && matches.length !== 1))
              reject("missing or duplicate application android:" + name);
            if (matches.length && !new RegExp("^\\s*A: android:" + name +
              "\\(0x[0-9a-fA-F]{8}\\)=\\(type 0x12\\)0x0+\\s*$").test(matches[0]))
              reject("application android:" + name + " must be false");
          }
          attribute("allowBackup", true);
          attribute("debuggable", false);
          attribute("testOnly", false);
          if (badging.split(/\r?\n/).some(line => /^application-debuggable(?:\s|$)/.test(line)))
            reject("aapt badging identifies a debuggable APK");
          console.log("PASS: downloaded APK package, biometric permission, backup and debug flags verified");
          NODE
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Negresco-Finance-V3.1.3-preview.apk > verified-apk-signer.txt
          mapfile -t CERT_HASHES < <(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F]{64}).*/\1/p' verified-apk-signer.txt | tr '[:upper:]' '[:lower:]')
          mapfile -t REPORT_HASHES < <(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F]{64}).*/\1/p' APK-SIGNATURE.txt | tr '[:upper:]' '[:lower:]')
          [[ ${#CERT_HASHES[@]} -eq 1 && ${#REPORT_HASHES[@]} -eq 1 ]] || { echo "::error::Exactly one APK signing identity is required."; exit 1; }
          [[ "${CERT_HASHES[0]}" == "$EXPECTED" && "${REPORT_HASHES[0]}" == "$EXPECTED" ]] || { echo "::error::Downloaded APK certificate does not match pinned release identity."; exit 1; }
          if grep -Eqi 'CN[[:space:]]*=[[:space:]]*Android Debug' verified-apk-signer.txt APK-SIGNATURE.txt; then
            echo "::error::Debug certificate is not a publishing identity."
            exit 1
          fi
          python3 - <<'PY'
          import hashlib
          import re
          import stat
          import zipfile
          from pathlib import Path

          apk = 'Negresco-Finance-V3.1.3-preview.apk'
          names = {apk, 'APK-SIGNATURE.txt', 'SHA256-original-apk.txt', 'LEIA-ME.txt'}
          bounds = {apk: 1024**3, 'APK-SIGNATURE.txt': 1024**2,
                    'SHA256-original-apk.txt': 512, 'LEIA-ME.txt': 1024**2}

          def digest(path):
              sha = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      sha.update(chunk)
              return sha.hexdigest()

          def zipped_digest(archive, name):
              sha = hashlib.sha256()
              with archive.open(name) as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      sha.update(chunk)
              return sha.hexdigest()

          for name in (apk, 'Negresco-Finance-V3.1.3-preview.zip', 'APK-SIGNATURE.txt'):
              path = Path(name)
              if path.is_symlink() or not path.is_file() or not path.stat().st_size:
                  raise SystemExit('BLOCK: missing or symlinked release artifact: ' + name)

          original = digest(Path(apk))
          with zipfile.ZipFile('Negresco-Finance-V3.1.3-preview.zip') as archive:
              members = archive.infolist()
              if len(members) != len(names) or {item.filename for item in members} != names:
                  raise SystemExit('BLOCK: ZIP has missing, duplicated or unexpected members')
              for member in members:
                  kind = stat.S_IFMT((member.external_attr >> 16) & 0xffff) if member.create_system == 3 else 0
                  if member.is_dir() or kind not in (0, stat.S_IFREG):
                      raise SystemExit('BLOCK: ZIP contains a link or special file')
                  if member.flag_bits & 1 or member.compress_type not in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED):
                      raise SystemExit('BLOCK: ZIP compression/encryption is unsupported')
                  if not 0 < member.file_size <= bounds[member.filename] or not member.compress_size:
                      raise SystemExit('BLOCK: ZIP member exceeds size limits')
                  if member.file_size > 200 * member.compress_size:
                      raise SystemExit('BLOCK: suspicious compression ratio')
              if zipped_digest(archive, apk) != original:
                  raise SystemExit('BLOCK: ZIP APK differs from signed standalone APK')
              if zipped_digest(archive, 'APK-SIGNATURE.txt') != digest(Path('APK-SIGNATURE.txt')):
                  raise SystemExit('BLOCK: ZIP signing report differs from standalone report')
              with archive.open('SHA256-original-apk.txt') as stream:
                  record = stream.read().decode('utf-8')
              match = re.fullmatch(r'([a-fA-F0-9]{64})  android/app/build/outputs/apk/release/app-release\.apk\n?', record)
              if not match or match.group(1).lower() != original:
                  raise SystemExit('BLOCK: ZIP original APK checksum mismatch')
              with archive.open('LEIA-ME.txt') as stream:
                  if not stream.read(1):
                      raise SystemExit('BLOCK: release readme is empty')
          print('PASS: downloaded APK signing certificate and ZIP identity independently verified')
          PY

      - name: Stage private draft and publish only after complete verified upload
        working-directory: release-payload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_POLICY_READ_TOKEN: ${{ secrets.NEGRESCO_RELEASE_POLICY_READ_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v3.1.3-preview-${GITHUB_SHA:0:7}"
          export RELEASE_TAG="$TAG"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid GitHub commit SHA for release tag."; exit 1; }
          # Read the administrative setting with a DIFFERENT, read-only credential.
          # The normal GITHUB_TOKEN retains contents:write for tag/draft creation.
          # A dedicated GitHub App/PAT secret must have Administration:read only.
          verify_immutable_policy() {
            if [[ -z "${RELEASE_POLICY_READ_TOKEN:-}" ]]; then
              echo "::error::Read-only release policy token is missing; publication is blocked before any tag or release."
              exit 1
            fi
            if [[ "$RELEASE_POLICY_READ_TOKEN" == "${GH_TOKEN:-}" ]]; then
              echo "::error::Release policy credential must not reuse the publishing token."
              exit 1
            fi
            local policy_file
            policy_file="$(mktemp)"
            if ! GH_TOKEN="$RELEASE_POLICY_READ_TOKEN" gh api "repos/${GH_REPO}/immutable-releases" >"$policy_file" 2>/dev/null; then
              rm -f "$policy_file"
              echo "::error::Cannot verify enabled GitHub immutable releases using Administration:read. No publication permitted."
              exit 1
            fi
            if ! node - "$policy_file" <<'NODE'
          const fs = require("node:fs");
          let policy;
          try { policy = JSON.parse(fs.readFileSync(process.argv[2], "utf8")); }
          catch {
            console.error("BLOCK: GitHub release immutability response is invalid JSON");
            process.exit(1);
          }
          if (!policy || policy.enabled !== true) {
            console.error("BLOCK: immutable releases must be enabled before creating a release tag");
            process.exit(1);
          }
          console.log("PASS: GitHub immutable releases are enabled");
          NODE
            then
              rm -f "$policy_file"
              return 1
            fi
            rm -f "$policy_file"
          }
          verify_immutable_policy
          # Fail closed unless remote Git ref resolves directly to the authorized commit.
          verify_exact_tag() {
            gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" | node -e '
              let raw = "";
              process.stdin.on("data", part => raw += part);
              process.stdin.on("end", () => {
                const ref = JSON.parse(raw);
                if (ref.ref !== "refs/tags/" + process.env.RELEASE_TAG ||
                    ref.object?.type !== "commit" ||
                    ref.object.sha !== process.env.GITHUB_SHA) {
                  console.error("BLOCK: git tag does not resolve to the exact authorized commit");
                  process.exit(1);
                }
              });
            '
          }
          # REST get-by-tag excludes drafts. List EVERY page with the
          # publishing token, which has push access and can see private drafts.
          # A failed/incomplete listing must never mean "safe to create".
          RELEASES_PREFLIGHT="$(mktemp)"
          if ! gh api --paginate --slurp "repos/${GH_REPO}/releases?per_page=100" >"$RELEASES_PREFLIGHT" 2>/dev/null; then
            rm -f "$RELEASES_PREFLIGHT"
            echo "::error::Cannot enumerate existing public or draft releases; refusing to create a tag."
            exit 1
          fi
          if ! node - "$RELEASES_PREFLIGHT" <<'NODE'
          const fs = require("node:fs");
          let pages;
          try { pages = JSON.parse(fs.readFileSync(process.argv[2], "utf8")); }
          catch {
            console.error("BLOCK: release listing is not valid JSON");
            process.exit(1);
          }
          if (!Array.isArray(pages) || pages.length === 0 ||
              pages.some(page => !Array.isArray(page) ||
                page.some(release => !release ||
                  typeof release.tag_name !== "string" ||
                  typeof release.draft !== "boolean"))) {
            console.error("BLOCK: release listing is incomplete or malformed");
            process.exit(1);
          }
          if (pages.some(page => page.some(release => release.tag_name === process.env.RELEASE_TAG))) {
            console.error("BLOCK: release already exists (draft or published); refusing to overwrite");
            process.exit(1);
          }
          console.log("PASS: no conflicting release, including private drafts, in paginated GitHub listing");
          NODE
          then
            rm -f "$RELEASES_PREFLIGHT"
            exit 1
          fi
          rm -f "$RELEASES_PREFLIGHT"
          # GitHub ignores --target if the git tag already exists. A 404 is the
          # only acceptable response; API failure, auth errors and timeouts BLOCK.
          TAG_LOOKUP="$(mktemp)"
          if gh api --include "repos/${GH_REPO}/git/ref/tags/${TAG}" >"$TAG_LOOKUP" 2>&1; then
            echo "::error::Git tag already exists; refusing to reuse an unknown target."
            exit 1
          fi
          if ! grep -Eq '^HTTP/[^[:space:]]+ 404([[:space:]]|$)' "$TAG_LOOKUP"; then
            echo "::error::Cannot prove git tag is absent (preflight API failure)."
            exit 1
          fi
          rm -f "$TAG_LOOKUP"
          # Draft releases may not create backing tags until published.
          # Explicitly create the lightweight tag first; creation fails on conflicts.
          gh api -X POST "repos/${GH_REPO}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" | node -e '
            let raw = "";
            process.stdin.on("data", part => raw += part);
            process.stdin.on("end", () => {
              const ref = JSON.parse(raw);
              if (ref.ref !== "refs/tags/" + process.env.RELEASE_TAG ||
                  ref.object?.type !== "commit" ||
                  ref.object.sha !== process.env.GITHUB_SHA) {
                console.error("BLOCK: tag creation response has wrong ref or SHA");
                process.exit(1);
              }
            });
          '
          verify_exact_tag
          # Drafts are not publicly listed. On an upload failure, leave the
          # incomplete candidate as a draft for manual review, never publish it.
          gh release create "$TAG" --verify-tag --title "Negresco Finance V3.1.3 - PREVIA de testes" --notes-file RELEASE_NOTES.md --draft --prerelease --latest=false
          if ! gh release upload "$TAG" Negresco-Finance-V3.1.3-preview.apk Negresco-Finance-V3.1.3-preview.zip SHA256-release.txt APK-SIGNATURE.txt; then
            echo "::error::Release upload failed. The incomplete release remains a draft; preserved Actions artifacts can be reviewed safely."
            exit 1
          fi
          # Confirm the remote draft contains exactly the expected assets/sizes.
          # A successful upload command alone does not prove a complete release.
          export RELEASE_DRAFT_ID_FILE
          RELEASE_DRAFT_ID_FILE="$(mktemp)"
          # CLI only supplies draft identity. Its assets representation is NOT
          # authoritative for the remote SHA256 or upload state.
          gh release view "$TAG" --json isDraft,isPrerelease,tagName,databaseId | node -e '
            const fs = require("node:fs");
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const release = JSON.parse(raw);
              if (release.isDraft !== true ||
                  release.isPrerelease !== true ||
                  release.tagName !== process.env.RELEASE_TAG ||
                  !Number.isSafeInteger(release.databaseId) || release.databaseId < 1 ||
                  !/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA || "")) {
                console.error("BLOCK: draft release identity or target SHA differs");
                process.exit(1);
              }
              fs.writeFileSync(process.env.RELEASE_DRAFT_ID_FILE, String(release.databaseId));
              console.log("PASS: CLI draft identity confirmed, REST asset proof required next");
            });
          '
          # REST is the SOLE authority for GitHub-uploaded SHA256 and asset state.
          # Do not promote any draft without proving all four uploaded REST assets.
          gh api "repos/${GH_REPO}/releases/$(cat "$RELEASE_DRAFT_ID_FILE")" | node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const required = [
              "Negresco-Finance-V3.1.3-preview.apk",
              "Negresco-Finance-V3.1.3-preview.zip",
              "SHA256-release.txt",
              "APK-SIGNATURE.txt"
            ];
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const release = JSON.parse(raw);
              const expectedId = Number(fs.readFileSync(process.env.RELEASE_DRAFT_ID_FILE,"utf8").trim());
              if (!Number.isSafeInteger(expectedId) || expectedId < 1 ||
                  release.id !== expectedId ||
                  release.tag_name !== process.env.RELEASE_TAG ||
                  release.draft !== true || release.prerelease !== true) {
                console.error("BLOCK: REST draft release identity differs from verified CLI draft");
                process.exit(1);
              }
              if (!Array.isArray(release.assets) ||
                  release.assets.length !== required.length) {
                console.error("BLOCK: REST draft asset count differs");
                process.exit(1);
              }
              const names = new Set();
              for (const asset of release.assets) {
                if (!asset || names.has(asset.name) || !required.includes(asset.name) ||
                    !Number.isSafeInteger(asset.size) || asset.size < 1 ||
                    asset.size !== fs.statSync(asset.name).size ||
                    asset.state !== "uploaded" ||
                    typeof asset.digest !== "string" ||
                    !/^sha256:[a-f0-9]{64}$/.test(asset.digest) ||
                    asset.digest !== ("sha256:" +
                      crypto.createHash("sha256").update(fs.readFileSync(asset.name)).digest("hex"))) {
                  console.error("BLOCK: REST draft asset SHA256 or metadata differs");
                  process.exit(1);
                }
                names.add(asset.name);
              }
              if (required.some(name => !names.has(name))) {
                console.error("BLOCK: REST draft missing required asset");
                process.exit(1);
              }
              console.log("PASS: GitHub REST draft agrees with original four SHA256 assets");
            });
          '
          # This is the *only* step which can make the release publicly visible.
          verify_exact_tag
          # Recheck after upload in case an administrator disabled protection.
          verify_immutable_policy
          gh release edit "$TAG" --draft=false --prerelease --latest=false
          # Post-publication is an AUDIT, not an atomic prevention mechanism.
          # If a published release differs, fail the run and demand human action;
          # do not attempt to remove an immutable release or delete its Git tag.
          verify_exact_tag
          gh api "repos/${GH_REPO}/releases/tags/${TAG}" | node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const required = [
              "Negresco-Finance-V3.1.3-preview.apk",
              "Negresco-Finance-V3.1.3-preview.zip",
              "SHA256-release.txt",
              "APK-SIGNATURE.txt"
            ];
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const release = JSON.parse(raw);
              const expectedId = Number(fs.readFileSync(process.env.RELEASE_DRAFT_ID_FILE,"utf8").trim());
              if (release.id !== expectedId ||
                  release.tag_name !== process.env.RELEASE_TAG ||
                  release.draft !== false || release.prerelease !== true ||
                  release.immutable !== true) {
                console.error("ALERT: published release identity or immutable state differs; manual incident review required");
                process.exit(1);
              }
              if (!Array.isArray(release.assets) ||
                  release.assets.length !== required.length) {
                console.error("ALERT: published asset count differs; manual incident review required");
                process.exit(1);
              }
              const names = new Set();
              for (const asset of release.assets) {
                if (names.has(asset.name) || !required.includes(asset.name) ||
                    !Number.isSafeInteger(asset.size) || asset.size < 1 ||
                    asset.size !== fs.statSync(asset.name).size ||
                    asset.state !== "uploaded" ||
                    typeof asset.digest !== "string" ||
                    asset.digest !== ("sha256:" +
                      crypto.createHash("sha256").update(fs.readFileSync(asset.name)).digest("hex"))) {
                  console.error("ALERT: published asset digest differs; manual incident review required");
                  process.exit(1);
                }
                names.add(asset.name);
              }
              if (required.some(name => !names.has(name))) {
                console.error("ALERT: published asset is missing; manual incident review required");
                process.exit(1);
              }
              console.log("PASS: published immutable prerelease retains original release ID and four assets");
            });
          '
          rm -f "$RELEASE_DRAFT_ID_FILE"
