name: Android APK (P0)
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build standalone test APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Verify APK structure and signature
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.negresco.finance'"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee android-apk.sha256
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: negresco-finance-p0-test-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android-apk.sha256
          if-no-files-found: error
          retention-days: 7
