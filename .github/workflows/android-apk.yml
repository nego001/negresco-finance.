name: Android APK (V3.1 candidate)
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/mobile/**'
      - 'tests/mobile-baseline.test.mjs'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest runners include Android SDK; avoid setup-android initialization failure.
      - name: Locate Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -d "${ANDROID_HOME:?Android SDK not available on runner}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Validate P0 repository contracts
        working-directory: .
        run: npm test
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Inspect native Expo Updates configuration
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "=== Expo Updates Android manifest entries ==="
          grep -n -A 4 -B 2 -E 'expo.modules.updates|expo-channel-name|EXPO_UPDATE' "$MANIFEST" || true
          echo "=== OTA references in Android resources ==="
          grep -R -n -E 'u.expo.dev|expo-channel-name|preview|0.2.0' android/app/src/main/res | head -80 || true
          echo "=== Expo resolved configuration ==="
          npx expo config --json | node -e '
            let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{
              const e=JSON.parse(s);
              const u=e.updates||{};
              console.log(JSON.stringify({runtimeVersion:e.runtimeVersion,updates:{enabled:u.enabled,url:u.url,requestHeaders:u.requestHeaders},projectId:e.extra?.eas?.projectId},null,2));
              if(u.url!=="https://u.expo.dev/a506611f-a159-4341-bed7-28dcbd47bf95"||u.requestHeaders?.["expo-channel-name"]!=="preview")process.exit(1);
            });
          '
      - name: Build standalone test APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Verify APK structure and signature
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.negresco.finance'"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee android-apk.sha256
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: negresco-finance-p0-test-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android-apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Package downloadable ZIP and release notes
        run: |
          set -euo pipefail
          mkdir -p release-package
          cp android/app/build/outputs/apk/release/app-release.apk release-package/Negresco-Finance-V3.1-candidate.apk
          cp android-apk.sha256 release-package/SHA256-original-apk.txt
          cat > release-package/LEIA-ME.txt <<'EOF'
          NEGRESCO FINANCE - V3.1 (CANDIDATO DE TESTES)
          Android package: com.negresco.finance
          Instalacao: extraia o APK ou baixe o APK separado no GitHub Releases.
          Estado: interface inicial experimental; sem operacoes bancarias reais.
          Integridade: confira o SHA256 publicado nos detalhes da versao.
          EOF
          cp release-package/Negresco-Finance-P0-v0.2.0.apk Negresco-Finance-P0-v0.2.0.apk
          (cd release-package && zip -q -9 -r ../Negresco-Finance-P0-v0.2.0.zip .)
          sha256sum Negresco-Finance-P0-v0.2.0.apk Negresco-Finance-P0-v0.2.0.zip > SHA256-release.txt
          cat > RELEASE_NOTES.md <<'EOF'
          ## Negresco Finance v0.2.0 - P0 (versao de testes)

          Build de teste V3.1: interface OLED, Guardiao local e preferencias persistentes. Requer instalacao no Samsung e validacao manual.

          ### Arquivos para baixar
          1. **Negresco-Finance-P0-v0.2.0.apk**: instalador Android separado, sem precisar extrair ZIP.
          2. **Negresco-Finance-P0-v0.2.0.zip**: pacote com APK, orientacoes e hash original.
          3. **SHA256-release.txt**: verificacao de integridade dos dois arquivos.

          ### Incluido nesta versao
          - Interface OLED com Guardiao local, validacao estrutural de boletos e preferencias visuais persistentes.\n          - Sem consulta online a empresas, Reclame Aqui ou bancos. Sem monitoramento bancario, historico permanente ou PDF.
          - Identificador Android `com.negresco.finance`.
          - Build de teste com verificacao de estrutura e assinatura no CI.

          ### Limitacoes e cuidados
          - **P0 experimental**: ainda nao validado por instalacao manual no Samsung.
          - Sem integracao bancaria, Pix real, contas ou transacoes financeiras.
          - Nao utilizar dados financeiros reais nesta versao.
          - OTA preview exige runtime nativo compativel. Instale este APK para ter a dependencia de preferencias locais.
          - APK de teste: nao e uma versao de producao nem distribuicao Play Store.

          ### Instalacao
          Baixe o APK separado, abra-o no Android e autorize a instalacao da fonte caso solicitado.
          EOF
      - name: Publish APK first, ZIP second in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v3.1-candidate-${GITHUB_SHA:0:7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Negresco Finance V3.1 - Candidato de testes" --notes-file RELEASE_NOTES.md --prerelease --latest=false
          else
            gh release create "$TAG" --target "${GITHUB_SHA}" --title "Negresco Finance v0.2.0 - P0 (Teste)" --notes-file RELEASE_NOTES.md --prerelease --latest=false
          fi
          gh release upload "$TAG" Negresco-Finance-P0-v0.2.0.apk Negresco-Finance-P0-v0.2.0.zip SHA256-release.txt --clobber
