name: Guardiao Expo prebuild integrity M128
on:
  push:
    branches:
      - lab/p01-guardiao-prebuild-integrity-m128-v1
permissions:
  contents: read
concurrency:
  group: guardiao-targeted-overrides-m128-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    name: M128 exact candidate prebuild manifest reconciliation (NO APK)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Restore immutable lab candidate
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/lab/p01-guardiao-prebuild-integrity-m128-v1
          test ! -e apps/mobile/package-lock.json
          git apply --check tooling/android/fixtures/guardiao-safe-insets-keyboard-candidate-m117.patch
          git apply tooling/android/fixtures/guardiao-safe-insets-keyboard-candidate-m117.patch
          cp tooling/android/fixtures/guardiao-mobile-m119-package-lock.json apps/mobile/package-lock.json
          printf '%s  %s\n' 'a31326388567fffdfccbe8ec08326fe089356a55f9058c5b669c70a28e579f27' apps/mobile/package-lock.json | sha256sum -c -
          node tooling/android/verify_guardiao_lock_m119.mjs apps/mobile/package.json apps/mobile/package-lock.json
      - name: Resolve only explicit outside-range laboratory overrides and audit
        working-directory: apps/mobile
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
          NPM_CONFIG_FORCE: 'false'
        run: |
          set -euo pipefail
          cp package.json "$RUNNER_TEMP/m128-manifest.json"
          cp package-lock.json "$RUNNER_TEMP/m128-original.json"
          audit() {
            local status=0
            npm audit --json --package-lock-only --include=dev --include=optional --include=peer --audit-level=info > "$RUNNER_TEMP/m128-$1-raw.json" 2>"$RUNNER_TEMP/m128-$1.err" || status=$?
            node ../../tooling/android/guardiao_locked_audit_m123.mjs "$RUNNER_TEMP/m128-$1-raw.json" "$status" package-lock.json > "$RUNNER_TEMP/m128-$1.json"
          }
          audit before
          node --input-type=module - <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {overrides} from '../../tooling/android/guardiao_targeted_overrides_m126.mjs';
          const p=JSON.parse(readFileSync('package.json','utf8'));
          if(Object.hasOwn(p,'overrides'))throw Error('unexpected existing overrides');
          p.overrides=overrides;
          writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          JS
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node ../../tooling/android/verify_guardiao_lock_m119.mjs package.json package-lock.json
          audit after
          node ../../tooling/android/guardiao_targeted_overrides_m126.mjs package.json "$RUNNER_TEMP/m128-original.json" package-lock.json "$RUNNER_TEMP/m128-before.json" "$RUNNER_TEMP/m128-after.json" > "$RUNNER_TEMP/m128-summary.json"
          cat "$RUNNER_TEMP/m128-summary.json"
          cmp "$RUNNER_TEMP/m128-original.json" ../../tooling/android/fixtures/guardiao-mobile-m119-package-lock.json
          sha256sum package.json package-lock.json > "$RUNNER_TEMP/m128-candidate.sha256"
      - name: Test only eligible candidates with actual Metro image pipeline
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          if ! node -e 'process.exit(require(process.argv[1]).candidateEligible?0:1)' "$RUNNER_TEMP/m128-summary.json"; then
            echo "BLOCK (LAB): targeted candidate did not satisfy security and graph gate"
            exit 0
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit
          printf '%s  %s\n' 'cbb8bec52cb7d62a9959cd92bb195c943ade634794b0f634e3c1af2f182c78b3' package-lock.json | sha256sum -c -
          node ../../tooling/android/guardiao_metro_prebuild_adapter_m128.mjs apply
          node ../../tooling/android/guardiao_targeted_overrides_smoke_m126.mjs
          node ../../tooling/android/guardiao_metro_compat_smoke_m127.mjs
          node ../../tooling/android/guardiao_metro_prebuild_adapter_m128.mjs verify
          cp package.json "$RUNNER_TEMP/m128-before-prebuild.json"
          CI=1 ./node_modules/.bin/expo prebuild --platform android --no-install
          node ../../tooling/android/guardiao_prebuild_integrity_m128.mjs "$RUNNER_TEMP/m128-before-prebuild.json" package.json
          cp "$RUNNER_TEMP/m128-before-prebuild.json" package.json
          sha256sum -c "$RUNNER_TEMP/m128-candidate.sha256"
          node ../../tooling/android/verify_guardiao_lock_m119.mjs package.json package-lock.json
          node ../../tooling/android/guardiao_metro_prebuild_adapter_m128.mjs verify
          ./node_modules/.bin/tsc --noEmit
          node ../../tooling/android/guardiao_targeted_overrides_smoke_m126.mjs
          mkdir "$RUNNER_TEMP/m128-eligible"
          cp package.json package-lock.json "$RUNNER_TEMP/m128-eligible/"
          cp "$RUNNER_TEMP/m128-summary.json" "$RUNNER_TEMP/m128-eligible/summary.json"
          sha256sum node_modules/metro/src/Assets.js > "$RUNNER_TEMP/m128-eligible/metro-assets.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: m128-eligible-targeted-candidate
          path: ${{ runner.temp }}/m128-eligible/
          if-no-files-found: ignore
          retention-days: 7
